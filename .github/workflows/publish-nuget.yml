name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Dry run only, or publish to nuget.org"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - nuget-org
      confirm:
        description: "Required for nuget-org: enter the exact DotCraft.Sdk version from the project file"
        required: false
        type: string

permissions:
  contents: read

jobs:
  pack:
    name: Validate, test, and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release inputs
        id: validate
        shell: pwsh
        env:
          PACKAGE_PROJECT: ./sdk/dotnet/src/DotCraft.Sdk/DotCraft.Sdk.csproj
          TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirm }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_FULL: ${{ github.ref }}
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path $env:PACKAGE_PROJECT)) {
            throw "Package project not found: $($env:PACKAGE_PROJECT)"
          }

          [xml]$project = Get-Content -Raw $env:PACKAGE_PROJECT
          $version = @($project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { ![string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1)
          $version = "$version".Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Set <Version> in $($env:PACKAGE_PROJECT) before publishing."
          }

          $previewPattern = '^\d+\.\d+\.\d+-preview\.\d+$'
          $stablePattern = '^\d+\.\d+\.\d+$'
          if ($version -match $previewPattern) {
            $channel = "preview"
          }
          elseif ($version -match $stablePattern) {
            $channel = "stable"
          }
          else {
            throw "DotCraft.Sdk <Version> must be MAJOR.MINOR.PATCH-preview.N or MAJOR.MINOR.PATCH. Current value: $version"
          }

          if ($env:TARGET -eq "nuget-org") {
            if ($env:GITHUB_REF_FULL -ne "refs/heads/main") {
              throw "nuget.org publishing is allowed only from the main branch."
            }
            $expected = $version
            if ($env:CONFIRM -cne $expected) {
              throw "Confirmation must exactly match the DotCraft.Sdk version: $expected"
            }
          }

          $indexUrl = "https://api.nuget.org/v3-flatcontainer/dotcraft.sdk/index.json"
          try {
            $index = Invoke-RestMethod -Uri $indexUrl
            $versions = @($index.versions)
          }
          catch {
            $statusCode = 0
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
            if ($statusCode -eq 404) {
              $versions = @()
            }
            else {
              throw
            }
          }

          if ($versions -contains $version.ToLowerInvariant()) {
            throw "DotCraft.Sdk $version already exists on nuget.org."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          Write-Host "Validated DotCraft.Sdk $version ($channel) for $($env:TARGET)."

      - name: Restore
        run: dotnet restore ./sdk/dotnet/DotCraft.Sdk.sln

      - name: Build
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          dotnet build ./sdk/dotnet/DotCraft.Sdk.sln `
            --configuration Release `
            --no-restore `
            /p:Version=$env:PACKAGE_VERSION `
            /p:PackageVersion=$env:PACKAGE_VERSION `
            /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test ./sdk/dotnet/DotCraft.Sdk.sln --configuration Release --no-build

      - name: Pack release artifacts
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts/nuget | Out-Null
          dotnet pack ./sdk/dotnet/src/DotCraft.Sdk/DotCraft.Sdk.csproj `
            --configuration Release `
            --no-build `
            --output artifacts/nuget `
            /p:Version=$env:PACKAGE_VERSION `
            /p:PackageVersion=$env:PACKAGE_VERSION `
            /p:ContinuousIntegrationBuild=true

      - name: Inspect package artifacts
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $nupkg = "artifacts/nuget/DotCraft.Sdk.$env:PACKAGE_VERSION.nupkg"
          $snupkg = "artifacts/nuget/DotCraft.Sdk.$env:PACKAGE_VERSION.snupkg"
          if (!(Test-Path $nupkg)) {
            throw "Missing package: $nupkg"
          }
          if (!(Test-Path $snupkg)) {
            throw "Missing symbol package: $snupkg"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $nupkg))
          try {
            $entries = @($package.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @(
              "lib/net10.0/DotCraft.Sdk.dll",
              "lib/net10.0/DotCraft.Protocol.Contracts.dll"
            )) {
              if ($entries -notcontains $required) {
                throw "Package is missing required entry: $required"
              }
            }

            $nuspecEntries = @($package.Entries | Where-Object { $_.FullName -like "*.nuspec" })
            if ($nuspecEntries.Count -ne 1) {
              throw "Expected exactly one .nuspec entry, found $($nuspecEntries.Count)."
            }
            $nuspecEntry = $nuspecEntries[0]
            $reader = [System.IO.StreamReader]::new($nuspecEntry.Open())
            try {
              $nuspec = $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }
            if ($nuspec -match '<dependency\s+id="DotCraft\.Protocol\.Contracts"') {
              throw "DotCraft.Sdk must bundle Contracts instead of declaring a package dependency."
            }
          }
          finally {
            $package.Dispose()
          }

          $symbols = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $snupkg))
          try {
            if ($symbols.Entries.FullName -contains "lib/net10.0/DotCraft.Protocol.Contracts.pdb") {
              throw "The symbol package must not contain DotCraft.Protocol.Contracts.pdb."
            }
          }
          finally {
            $symbols.Dispose()
          }

          Get-ChildItem artifacts/nuget | Format-Table Name, Length
          Get-FileHash $nupkg, $snupkg -Algorithm SHA256 | Format-Table Algorithm, Hash, Path

      - name: Restore bundled contracts from isolated source
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $probe = Join-Path ([System.IO.Path]::GetTempPath()) "dotcraft-sdk-package-probe-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $probe | Out-Null
          try {
            dotnet new console --framework net10.0 --no-restore --output $probe
            Push-Location $probe
            try {
              dotnet add package DotCraft.Sdk --version $env:PACKAGE_VERSION --no-restore
              $nugetConfig = @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="package-under-test" value="PACKAGE_SOURCE" />
            </packageSources>
          </configuration>
          '@
              $packageSource = (Resolve-Path "$env:GITHUB_WORKSPACE/artifacts/nuget").Path
              $nugetConfig.Replace("PACKAGE_SOURCE", $packageSource) | Set-Content -Encoding utf8 NuGet.config
              $program = @'
          using DotCraft.Protocol.Contracts;
          using DotCraft.Sdk.AppServer;

          _ = new RpcEmpty();
          _ = new DotCraftClientOptions();
          '@
              $program | Set-Content -Encoding utf8 Program.cs
              dotnet restore --configfile NuGet.config
              dotnet build --no-restore
            }
            finally {
              Pop-Location
            }
          }
          finally {
            Remove-Item -LiteralPath $probe -Recurse -Force
          }

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotcraft-sdk-${{ steps.validate.outputs.version }}
          path: artifacts/nuget/*
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    needs: pack
    if: ${{ inputs.target == 'nuget-org' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: dotcraft-sdk-${{ needs.pack.outputs.version }}
          path: artifacts/nuget

      - name: Validate NuGet trusted publishing user
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw "Set NUGET_USER to the nuget.org username that created the Trusted Publishing policy. Do not use the GitHubActions publisher label or an email address."
          }

      - name: NuGet login through Trusted Publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push exact package artifacts
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.pack.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $source = "https://api.nuget.org/v3/index.json"
          $nupkg = "artifacts/nuget/DotCraft.Sdk.$env:PACKAGE_VERSION.nupkg"
          # NuGet pushes the sibling .snupkg automatically when it is next to the .nupkg.
          dotnet nuget push $nupkg --source $source --api-key $env:NUGET_API_KEY
