<svg xmlns="http://www.w3.org/2000/svg" width="800" height="498" viewBox="0 0 800 498" role="img" aria-label="DotCraft Automations and Goals overview: an Automation runs a workspace task on a schedule or on demand, a Goal pins one long-running objective to a conversation, and both drive the same conversation. Unbound runs leave their changes in a worktree to review, and an idle conversation is picked back up by auto-continue.">
  <title>Automations and Goals</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#2b2e33"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#a9abb0"/></marker>
    <pattern id="hat_autom" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eef2fe"/>
      <rect width="3" height="8" fill="#2d5cf0" opacity="0.13"/>
    </pattern>
    <pattern id="dots_autom" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f0f0f2"/>
      <circle cx="3" cy="3" r="1.1" fill="#dfdfe3"/>
    </pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
      .dtitle{font-size:18px;font-weight:700;fill:#1a1c1f;letter-spacing:.2px}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;fill:#82858a}
      .title{font-size:15px;font-weight:600;fill:#1a1c1f}
      .sub{font-size:13px;font-weight:600;fill:#1a1c1f}
      .body{font-size:12px;font-weight:400;fill:#55585c}
      .mono{font-size:12px;font-weight:400;fill:#55585c;font-family:ui-monospace,"SFMono-Regular","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace}
      .node{fill:#ffffff;stroke:#1a1c1f;stroke-width:1.5}
      .accent{fill:url(#hat_autom);stroke:#1d3fbf;stroke-width:2}
      .zone{fill:url(#dots_autom)}
      .frame{fill:#ffffff;stroke:#1d3fbf;stroke-width:2}
      .ghost{fill:none;stroke:#d9d9dc;stroke-width:1.5;stroke-dasharray:5 4}
      .link{stroke:#2b2e33;stroke-width:1.5;fill:none;stroke-linejoin:round}
      .link2{stroke:#a9abb0;stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-dasharray:4 4}
      .cap{font-size:12px;font-weight:600;fill:#1a1c1f}
    </style>
  </defs>
  <rect width="800" height="498" fill="#f9f9f9"/>
  <text x="36" y="40" class="dtitle">Automations and Goals</text>
  <svg x="734" y="14" width="30" height="30" viewBox="0 0 1024 1024" fill="none">
    <defs>
      <linearGradient id="lb_autom" x1="279" y1="766" x2="736" y2="334" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2458f7"/><stop offset=".46" stop-color="#5f82f7"/><stop offset="1" stop-color="#8fa5ff"/>
      </linearGradient>
      <linearGradient id="lm_autom" x1="380" y1="696" x2="492" y2="557" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2257f5"/><stop offset=".55" stop-color="#577df7"/><stop offset="1" stop-color="#8ca2ff"/>
      </linearGradient>
      <linearGradient id="ly_autom" x1="481" y1="174" x2="617" y2="713" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffcf11"/><stop offset="1" stop-color="#f6b500"/>
      </linearGradient>
      <filter id="ls_autom" x="-12%" y="-12%" width="124%" height="124%">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b3d62" flood-opacity=".18"/>
      </filter>
    </defs>
    <g transform="translate(512 528) scale(1.3) translate(-512 -512)">
      <g filter="url(#ls_autom)">
        <rect x="201" y="365" width="622" height="513" rx="151" fill="#fff"/>
        <rect x="145" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="743" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="438" y="270" width="148" height="182" rx="2" fill="#fff"/>
        <circle cx="512" cy="229" r="116" fill="#fff"/>
      </g>
      <rect x="243" y="408" width="538" height="426" rx="113" fill="url(#lb_autom)"/>
      <rect x="188" y="514" width="90" height="171" rx="19" fill="url(#lb_autom)"/>
      <rect x="746" y="514" width="90" height="171" rx="19" fill="url(#lb_autom)"/>
      <rect x="479" y="337" width="66" height="119" rx="6" fill="url(#lb_autom)"/>
      <rect x="295" y="464" width="434" height="315" rx="78" fill="#fff"/>
      <circle cx="512" cy="229" r="73" fill="url(#ly_autom)"/>
      <path d="M387 568 477 634 387 700" stroke="url(#lm_autom)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M531 696h116" stroke="url(#ly_autom)" stroke-width="27" stroke-linecap="round"/>
    </g>
  </svg>
  <g transform="translate(0,54)">
  <rect x="52" y="40" width="330" height="64" rx="10" class="accent"/>
  <g transform="translate(70,51) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12,7.4 V12 l3.4,2"/></g>
  <text x="98" y="66" class="title">Automations</text>
  <text x="70" y="86" class="body">schedule or on-demand runs</text>
  <rect x="418" y="40" width="330" height="64" rx="10" class="accent"/>
  <g transform="translate(436,51) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3"/></g>
  <text x="464" y="66" class="title">Goals</text>
  <text x="436" y="86" class="body">one objective per conversation</text>
  <path d="M168 104 V182" class="link" marker-end="url(#a)"/>
  <text x="180" y="148" class="eyebrow">STARTS A RUN</text>
  <path d="M632 104 V182" class="link" marker-end="url(#a)"/>
  <text x="644" y="148" class="eyebrow">SETS DIRECTION</text>
  <rect x="52" y="184" width="696" height="64" rx="10" class="node"/>
  <g transform="translate(70,195) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4,14.5 L6.8,5.5 h10.4 L20,14.5 M4,14.5 h4.5 l2,2.8 h3 l2,-2.8 H20 M4,14.5 V18 a2,2 0 0 0 2,2 h12 a2,2 0 0 0 2,-2 v-3.5"/></g>
  <text x="98" y="210" class="title">One conversation</text>
  <text x="70" y="230" class="body">progress and completion state stay here</text>
  <path d="M168 248 V314" class="link2" marker-end="url(#b)"/>
  <text x="180" y="286" class="eyebrow">UNBOUND RUNS</text>
  <rect x="52" y="316" width="330" height="64" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <g transform="translate(70,327) scale(0.8333)" fill="none" stroke="#55585c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="6.3"/><path d="M15.5,15.5 L20.5,20.5"/></g>
  <text x="98" y="342" class="title">Worktree to review</text>
  <text x="70" y="362" class="body">changes stay off your workspace</text>
  <path d="M632 248 V314" class="link2" marker-end="url(#b)"/>
  <text x="644" y="286" class="eyebrow">WHEN IDLE</text>
  <rect x="418" y="316" width="330" height="64" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <g transform="translate(436,327) scale(0.8333)" fill="none" stroke="#55585c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5,10 A7,7 0 0 1 18.5,8 M18.8,3.8 L18.6,8.2 14.2,8"/><path d="M18.5,14 A7,7 0 0 1 5.5,16 M5.2,20.2 L5.4,15.8 9.8,16"/></g>
  <text x="464" y="342" class="title">Auto-continue</text>
  <text x="436" y="362" class="body">the goal picks the work back up</text>
  <path d="M418 348 H400 V250" class="link2" marker-end="url(#b)"/>
  <text x="52" y="416" class="cap">One conversation, timed and aimed.</text>
  </g>
</svg>
