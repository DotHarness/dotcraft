<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A DotCraft project workspace</title>
  <desc id="desc">Desktop, CLI, editors, and automations open one project folder. The folder contains project files and DotCraft context. Git shares tracked files, while a complete session backup stops AppServer and copies the whole folder for restore at the same absolute path.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill: #17203A; font-size: 38px; font-weight: 760; }
    .subtitle { fill: #667085; font-size: 17px; }
    .cardTitle { fill: #17203A; font-size: 22px; font-weight: 740; }
    .label { fill: #344054; font-size: 15px; font-weight: 690; }
    .body { fill: #475467; font-size: 14px; }
    .small { fill: #667085; font-size: 13px; }
    .mono { fill: #344054; font-size: 14px; font-family: "Cascadia Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#F8FAF7"/>
  <text x="64" y="72" class="title">One project, one shared workspace</text>
  <text x="64" y="105" class="subtitle">Every DotCraft entry point opens the same project folder and works from the same project context.</text>

  <g transform="translate(64 146)">
    <rect width="1152" height="80" rx="10" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="24" y="31" class="small">ENTRY POINTS</text>
    <g transform="translate(24 42)">
      <rect width="122" height="28" rx="14" fill="#E9F5F0"/><text x="61" y="19" text-anchor="middle" fill="#247A57" font-size="13" font-weight="700">Desktop</text>
      <rect x="136" width="86" height="28" rx="14" fill="#E9F5F0"/><text x="179" y="19" text-anchor="middle" fill="#247A57" font-size="13" font-weight="700">CLI</text>
      <rect x="236" width="146" height="28" rx="14" fill="#E9F5F0"/><text x="309" y="19" text-anchor="middle" fill="#247A57" font-size="13" font-weight="700">Editor</text>
      <rect x="396" width="154" height="28" rx="14" fill="#E9F5F0"/><text x="473" y="19" text-anchor="middle" fill="#247A57" font-size="13" font-weight="700">Channels</text>
      <rect x="564" width="154" height="28" rx="14" fill="#E9F5F0"/><text x="641" y="19" text-anchor="middle" fill="#247A57" font-size="13" font-weight="700">Automations</text>
    </g>
    <path d="M766 54H912" stroke="#98A2B3" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="920" y="16" width="208" height="48" rx="8" fill="#EAF0FF"/>
    <text x="1024" y="37" text-anchor="middle" fill="#3659D4" font-size="15" font-weight="730">Project folder</text>
    <text x="1024" y="55" text-anchor="middle" class="small">the workspace you open</text>
  </g>

  <g transform="translate(64 266)">
    <rect width="1152" height="276" rx="12" fill="#FFFFFF" stroke="#C2CEF7" stroke-width="2"/>
    <text x="24" y="38" class="cardTitle">Project folder</text>

    <g transform="translate(24 60)">
      <rect width="528" height="188" rx="10" fill="#EAF0FF"/>
      <text x="22" y="34" fill="#23305F" font-size="18" font-weight="730">Project files</text>
      <text x="22" y="64" class="mono">code/ · docs/ · tests/ · README.md</text>
      <text x="22" y="105" class="body">The files your team builds and reviews.</text>
      <text x="22" y="142" class="small">DotCraft works beside the project files.</text>
    </g>

    <g transform="translate(576 60)">
      <rect width="552" height="188" rx="10" fill="#E9F5F0"/>
      <text x="22" y="34" fill="#153E33" font-size="18" font-weight="730">DotCraft context</text>
      <text x="22" y="64" class="mono">.craft/</text>
      <text x="22" y="99" class="label">Instructions · memory · skills · plugins</text>
      <text x="22" y="128" class="label">Workspace settings · conversations · supporting files</text>
      <text x="22" y="162" class="small">Project-specific context stays with the project.</text>
    </g>
  </g>

  <g transform="translate(64 582)">
    <rect width="552" height="126" rx="10" fill="#FFF1E6" stroke="#F3C9A4"/>
    <text x="22" y="34" fill="#623314" font-size="18" font-weight="730">Share with Git</text>
    <text x="22" y="64" class="body">Share only the files you review and track.</text>
    <text x="22" y="91" class="small">Ignored local data is not part of the clone.</text>
  </g>

  <g transform="translate(664 582)">
    <rect width="552" height="126" rx="10" fill="#F1EBFA" stroke="#D7C5EF"/>
    <text x="22" y="34" fill="#39205F" font-size="18" font-weight="730">Back up the complete workspace</text>
    <text x="22" y="64" class="body">Stop every DotCraft process using this workspace, then copy the folder.</text>
    <text x="22" y="91" class="small">Restore the folder to the same absolute path.</text>
  </g>
</svg>
