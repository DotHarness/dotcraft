<svg xmlns="http://www.w3.org/2000/svg" width="800" height="594" viewBox="0 0 800 594" role="img" aria-label="DotCraft AppServer mode topology: external clients reach one host process over JSON-RPC, choosing the stdio transport (one client per server process) or the WebSocket listener (many concurrent connections), with both able to run at once. AppServer projects the host's single session core rather than creating a second one.">
  <title>AppServer mode topology</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#2b2e33"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#a9abb0"/></marker>
    <pattern id="hat_apmode" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eef2fe"/>
      <rect width="3" height="8" fill="#2d5cf0" opacity="0.13"/>
    </pattern>
    <pattern id="dots_apmode" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f0f0f2"/>
      <circle cx="3" cy="3" r="1.1" fill="#dfdfe3"/>
    </pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
      .dtitle{font-size:18px;font-weight:700;fill:#1a1c1f;letter-spacing:.2px}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;fill:#82858a}
      .title{font-size:15px;font-weight:600;fill:#1a1c1f}
      .sub{font-size:13px;font-weight:600;fill:#1a1c1f}
      .body{font-size:12px;font-weight:400;fill:#55585c}
      .mono{font-size:12px;font-weight:400;fill:#55585c;font-family:ui-monospace,"SFMono-Regular","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace}
      .node{fill:#ffffff;stroke:#1a1c1f;stroke-width:1.5}
      .accent{fill:url(#hat_apmode);stroke:#1d3fbf;stroke-width:2}
      .zone{fill:url(#dots_apmode)}
      .frame{fill:#ffffff;stroke:#1d3fbf;stroke-width:2}
      .ghost{fill:none;stroke:#d9d9dc;stroke-width:1.5;stroke-dasharray:5 4}
      .link{stroke:#2b2e33;stroke-width:1.5;fill:none;stroke-linejoin:round}
      .link2{stroke:#a9abb0;stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-dasharray:4 4}
      .cap{font-size:12px;font-weight:600;fill:#1a1c1f}
    </style>
  </defs>
  <rect width="800" height="594" fill="#f9f9f9"/>
  <text x="36" y="40" class="dtitle">AppServer mode topology</text>
  <svg x="734" y="14" width="30" height="30" viewBox="0 0 1024 1024" fill="none">
    <defs>
      <linearGradient id="lb_apmode" x1="279" y1="766" x2="736" y2="334" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2458f7"/><stop offset=".46" stop-color="#5f82f7"/><stop offset="1" stop-color="#8fa5ff"/>
      </linearGradient>
      <linearGradient id="lm_apmode" x1="380" y1="696" x2="492" y2="557" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2257f5"/><stop offset=".55" stop-color="#577df7"/><stop offset="1" stop-color="#8ca2ff"/>
      </linearGradient>
      <linearGradient id="ly_apmode" x1="481" y1="174" x2="617" y2="713" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffcf11"/><stop offset="1" stop-color="#f6b500"/>
      </linearGradient>
      <filter id="ls_apmode" x="-12%" y="-12%" width="124%" height="124%">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b3d62" flood-opacity=".18"/>
      </filter>
    </defs>
    <g transform="translate(512 528) scale(1.3) translate(-512 -512)">
      <g filter="url(#ls_apmode)">
        <rect x="201" y="365" width="622" height="513" rx="151" fill="#fff"/>
        <rect x="145" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="743" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="438" y="270" width="148" height="182" rx="2" fill="#fff"/>
        <circle cx="512" cy="229" r="116" fill="#fff"/>
      </g>
      <rect x="243" y="408" width="538" height="426" rx="113" fill="url(#lb_apmode)"/>
      <rect x="188" y="514" width="90" height="171" rx="19" fill="url(#lb_apmode)"/>
      <rect x="746" y="514" width="90" height="171" rx="19" fill="url(#lb_apmode)"/>
      <rect x="479" y="337" width="66" height="119" rx="6" fill="url(#lb_apmode)"/>
      <rect x="295" y="464" width="434" height="315" rx="78" fill="#fff"/>
      <circle cx="512" cy="229" r="73" fill="url(#ly_apmode)"/>
      <path d="M387 568 477 634 387 700" stroke="url(#lm_apmode)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M531 696h116" stroke="url(#ly_apmode)" stroke-width="27" stroke-linecap="round"/>
    </g>
  </svg>
  <g transform="translate(0,54)">
  <rect x="36" y="140" width="728" height="324" rx="14" class="zone"/>
  <text x="54" y="166" class="eyebrow">ONE HOST PROCESS</text>
  <rect x="52" y="40" width="696" height="64" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <g transform="translate(70,51) scale(0.8333)" fill="none" stroke="#55585c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="4.5" width="16.4" height="11.5" rx="1.8"/><path d="M12,16 V19.3 M8.4,19.5 H15.6"/></g>
  <text x="98" y="66" class="title">External clients</text>
  <text x="70" y="86" class="body">Desktop · ACP · CLI · SDKs · custom integrations</text>
  <path d="M221 106 V182" class="link" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M579 106 V182" class="link" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="400" y="128" class="eyebrow" text-anchor="middle">JSON-RPC</text>
  <rect x="52" y="184" width="338" height="64" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <g transform="translate(70,195) scale(0.8333)" fill="none" stroke="#55585c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="4.2" width="16.4" height="15.6" rx="2"/><path d="M7.4,9.2 l3,2.8 -3,2.8 M12.4,14.8 h4.2"/></g>
  <text x="98" y="210" class="title">stdio transport</text>
  <text x="70" y="230" class="body">one client per server process</text>
  <rect x="410" y="184" width="338" height="64" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <g transform="translate(428,195) scale(0.8333)" fill="none" stroke="#55585c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.8,12.6 H8 L10.2,7.6 13.8,17 15.8,12.6 H20.2"/></g>
  <text x="456" y="210" class="title">WebSocket listener</text>
  <text x="428" y="230" class="body">many connections at once</text>
  <path d="M221 250 V278" class="link" marker-end="url(#a)"/>
  <path d="M579 250 V278" class="link" marker-end="url(#a)"/>
  <rect x="52" y="280" width="696" height="64" rx="10" class="accent"/>
  <g transform="translate(70,291) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="6.2" rx="1.6"/><rect x="4.5" y="13.3" width="15" height="6.2" rx="1.6"/><circle cx="7.6" cy="7.6" r="1.1" fill="#1d3fbf" stroke="none"/><circle cx="7.6" cy="16.4" r="1.1" fill="#1d3fbf" stroke="none"/></g>
  <text x="98" y="306" class="title">AppServer</text>
  <text x="70" y="326" class="body">both transports can run at once</text>
  <path d="M400 346 V374" class="link" marker-end="url(#a)"/>
  <text x="412" y="366" class="eyebrow">PROJECTS</text>
  <rect x="52" y="376" width="696" height="64" rx="10" class="node"/>
  <g transform="translate(70,387) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4,9 l8,-4 8,4 v8 l-8,4 -8,-4 z M4,9 l8,4 8,-4 M12,13 v8"/></g>
  <text x="98" y="402" class="title">Session core</text>
  <text x="70" y="422" class="body">one per process, shared by every client</text>
  <text x="52" y="500" class="cap">Many connections, one session core.</text>
  <rect x="498" y="480" width="250" height="32" rx="16" fill="#f5edd6" class="capsule"/>
  <text x="623" y="500" class="body" text-anchor="middle" fill="#7a5d1d">Off loopback, always set a token.</text>
  </g>
</svg>
