<svg xmlns="http://www.w3.org/2000/svg" width="800" height="666" viewBox="0 0 800 666" role="img" aria-label="DotCraft entry points: Desktop, CLI, editors over ACP, chat channels, and custom clients are five surfaces onto one workspace. Every surface reaches the same AppServer, which runs one per workspace, and the same shared session core holding threads, memory, skills, and config — so a thread started in one entry continues in another.">
  <title>DotCraft entry points</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#2b2e33"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#a9abb0"/></marker>
    <pattern id="hat_entry" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eef2fe"/>
      <rect width="3" height="8" fill="#2d5cf0" opacity="0.13"/>
    </pattern>
    <pattern id="dots_entry" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f0f0f2"/>
      <circle cx="3" cy="3" r="1.1" fill="#dfdfe3"/>
    </pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
      .dtitle{font-size:18px;font-weight:700;fill:#1a1c1f;letter-spacing:.2px}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;fill:#82858a}
      .title{font-size:15px;font-weight:600;fill:#1a1c1f}
      .sub{font-size:13px;font-weight:600;fill:#1a1c1f}
      .body{font-size:12px;font-weight:400;fill:#55585c}
      .mono{font-size:12px;font-weight:400;fill:#55585c;font-family:ui-monospace,"SFMono-Regular","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace}
      .node{fill:#ffffff;stroke:#1a1c1f;stroke-width:1.5}
      .accent{fill:url(#hat_entry);stroke:#1d3fbf;stroke-width:2}
      .zone{fill:url(#dots_entry)}
      .frame{fill:#ffffff;stroke:#1d3fbf;stroke-width:2}
      .ghost{fill:none;stroke:#d9d9dc;stroke-width:1.5;stroke-dasharray:5 4}
      .link{stroke:#2b2e33;stroke-width:1.5;fill:none;stroke-linejoin:round}
      .link2{stroke:#a9abb0;stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-dasharray:4 4}
      .cap{font-size:12px;font-weight:600;fill:#1a1c1f}
    </style>
  </defs>
  <rect width="800" height="666" fill="#f9f9f9"/>
  <text x="36" y="40" class="dtitle">DotCraft entry points</text>
  <svg x="734" y="14" width="30" height="30" viewBox="0 0 1024 1024" fill="none">
    <defs>
      <linearGradient id="lb_entry" x1="279" y1="766" x2="736" y2="334" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2458f7"/><stop offset=".46" stop-color="#5f82f7"/><stop offset="1" stop-color="#8fa5ff"/>
      </linearGradient>
      <linearGradient id="lm_entry" x1="380" y1="696" x2="492" y2="557" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2257f5"/><stop offset=".55" stop-color="#577df7"/><stop offset="1" stop-color="#8ca2ff"/>
      </linearGradient>
      <linearGradient id="ly_entry" x1="481" y1="174" x2="617" y2="713" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffcf11"/><stop offset="1" stop-color="#f6b500"/>
      </linearGradient>
      <filter id="ls_entry" x="-12%" y="-12%" width="124%" height="124%">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b3d62" flood-opacity=".18"/>
      </filter>
    </defs>
    <g transform="translate(512 528) scale(1.3) translate(-512 -512)">
      <g filter="url(#ls_entry)">
        <rect x="201" y="365" width="622" height="513" rx="151" fill="#fff"/>
        <rect x="145" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="743" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="438" y="270" width="148" height="182" rx="2" fill="#fff"/>
        <circle cx="512" cy="229" r="116" fill="#fff"/>
      </g>
      <rect x="243" y="408" width="538" height="426" rx="113" fill="url(#lb_entry)"/>
      <rect x="188" y="514" width="90" height="171" rx="19" fill="url(#lb_entry)"/>
      <rect x="746" y="514" width="90" height="171" rx="19" fill="url(#lb_entry)"/>
      <rect x="479" y="337" width="66" height="119" rx="6" fill="url(#lb_entry)"/>
      <rect x="295" y="464" width="434" height="315" rx="78" fill="#fff"/>
      <circle cx="512" cy="229" r="73" fill="url(#ly_entry)"/>
      <path d="M387 568 477 634 387 700" stroke="url(#lm_entry)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M531 696h116" stroke="url(#ly_entry)" stroke-width="27" stroke-linecap="round"/>
    </g>
  </svg>
  <g transform="translate(0,54)">
  <rect x="36" y="40" width="362" height="428" rx="14" class="zone"/>
  <text x="54" y="66" class="eyebrow">PICK ANY SURFACE</text>
  <rect x="52" y="84" width="330" height="64" rx="10" class="node"/>
  <g transform="translate(70,95) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="4.5" width="16.4" height="11.5" rx="1.8"/><path d="M12,16 V19.3 M8.4,19.5 H15.6"/></g>
  <text x="98" y="110" class="title">Desktop</text>
  <text x="70" y="130" class="body">the full graphical workspace</text>
  <rect x="52" y="160" width="330" height="64" rx="10" class="node"/>
  <g transform="translate(70,171) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="4.2" width="16.4" height="15.6" rx="2"/><path d="M7.4,9.2 l3,2.8 -3,2.8 M12.4,14.8 h4.2"/></g>
  <text x="98" y="186" class="title">CLI</text>
  <text x="70" y="206" class="body">one-shot commands · SSH · CI</text>
  <rect x="52" y="236" width="330" height="64" rx="10" class="node"/>
  <g transform="translate(70,247) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5,3.5 H14 L18.5,8 V20.5 H6.5 Z M14,3.5 V8 h4.5"/><path d="M9.3,13 h5.4 M9.3,16.5 h5.4"/></g>
  <text x="98" y="262" class="title">Editor (ACP)</text>
  <text x="70" y="282" class="body">JetBrains · Obsidian · Unity</text>
  <rect x="52" y="312" width="330" height="64" rx="10" class="node"/>
  <g transform="translate(70,323) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4,14.5 L6.8,5.5 h10.4 L20,14.5 M4,14.5 h4.5 l2,2.8 h3 l2,-2.8 H20 M4,14.5 V18 a2,2 0 0 0 2,2 h12 a2,2 0 0 0 2,-2 v-3.5"/></g>
  <text x="98" y="338" class="title">Channels &amp; bots</text>
  <text x="70" y="358" class="body">QQ · WeCom · Feishu · Telegram · WeChat</text>
  <rect x="52" y="388" width="330" height="64" rx="10" class="ghost"/>
  <g transform="translate(70,399) scale(0.8333)" fill="none" stroke="#82858a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4,9 l8,-4 8,4 v8 l-8,4 -8,-4 z M4,9 l8,4 8,-4 M12,13 v8"/></g>
  <text x="98" y="414" class="title">Custom clients</text>
  <text x="70" y="434" class="body">anything built on the SDKs</text>
  <rect x="430" y="146" width="334" height="216" rx="14" class="zone"/>
  <text x="448" y="172" class="eyebrow">ONE SHARED WORKSPACE</text>
  <rect x="446" y="190" width="302" height="64" rx="10" class="node"/>
  <g transform="translate(464,201) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="6.2" rx="1.6"/><rect x="4.5" y="13.3" width="15" height="6.2" rx="1.6"/><circle cx="7.6" cy="7.6" r="1.1" fill="#1a1c1f" stroke="none"/><circle cx="7.6" cy="16.4" r="1.1" fill="#1a1c1f" stroke="none"/></g>
  <text x="492" y="216" class="title">DotCraft AppServer</text>
  <text x="464" y="236" class="body">one per workspace · started for you</text>
  <rect x="446" y="282" width="302" height="64" rx="10" class="accent"/>
  <g transform="translate(464,293) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12,3.8 L20,8 12,12.2 4,8 Z" stroke-linejoin="round"/><path d="M4.5,12.5 L12,16.5 19.5,12.5 M4.5,16.5 L12,20.5 19.5,16.5"/></g>
  <text x="492" y="308" class="title">Shared session core</text>
  <text x="464" y="328" class="body">threads · memory · skills · config</text>
  <path d="M597 254 V280" class="link" marker-end="url(#a)"/>
  <path d="M382 116 H414" class="link"/>
  <path d="M382 192 H414" class="link"/>
  <path d="M382 268 H414" class="link"/>
  <path d="M382 344 H414" class="link"/>
  <path d="M382 420 H414" class="link"/>
  <path d="M414 116 V420" class="link"/>
  <path d="M414 222 H444" class="link" marker-end="url(#a)"/>
  <rect x="52" y="508" width="696" height="40" rx="20" fill="#f5edd6" class="capsule"/>
  <text x="400" y="532" class="body" text-anchor="middle" fill="#7a5d1d">Threads you start in one entry continue in another.</text>
  <text x="52" y="584" class="cap">Many surfaces, one agent.</text>
  </g>
</svg>
