<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DotCraft entry points topology</title>
  <desc id="desc">A grouped diagram showing DotCraft entry point surfaces around one workspace and session core.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .title { fill: #17203A; font-size: 42px; font-weight: 760; }
    .subtitle { fill: #667085; font-size: 18px; }
    .cardTitle { font-size: 24px; font-weight: 760; }
    .label { font-size: 14px; font-weight: 720; }
    .body { fill: #1F2937; font-size: 15px; }
    .mono { fill: #1F2937; font-size: 15px; font-family: "Cascadia Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .muted { fill: #667085; font-size: 13px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="#F8FAF7"/>
  <text x="72" y="86" class="title">DotCraft entry points topology</text>
  <text x="72" y="123" class="subtitle">Pick the surface you want; all surfaces talk to the same workspace and unified session core.</text>

  <g transform="translate(490 218)">
    <rect x="0" y="0" width="460" height="240" rx="8" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="32" y="52" class="cardTitle" fill="#17203A">Shared workspace</text>
    <line x1="32" y1="76" x2="428" y2="76" stroke="#D9E0EA"/>
    <text x="32" y="112" class="mono">.craft/</text>
    <text x="32" y="140" class="mono">threads, memory, skills</text>
    <text x="32" y="168" class="mono">config, plugins, tools</text>
    <text x="32" y="210" class="muted">Threads, memory, and tools stay in one shared workspace.</text>
  </g>

  <g transform="translate(72 196)">
    <rect x="0" y="0" width="310" height="150" rx="8" fill="#EAF0FF" stroke="#C2CEF7"/>
    <text x="24" y="42" class="cardTitle" fill="#23305F">Desktop</text>
    <text x="24" y="78" class="label" fill="#4459B8">Graphical collaboration</text>
    <text x="24" y="110" class="muted">Diffs, approvals, long-running work.</text>
  </g>
  <g transform="translate(72 388)">
    <rect x="0" y="0" width="310" height="150" rx="8" fill="#E9F5F0" stroke="#B7DED0"/>
    <text x="24" y="42" class="cardTitle" fill="#153E33">CLI</text>
    <text x="24" y="78" class="label" fill="#2E6B56">One-shot command line</text>
    <text x="24" y="110" class="muted">Scripts, SSH, CI, lightweight tasks.</text>
  </g>
  <g transform="translate(72 580)">
    <rect x="0" y="0" width="310" height="150" rx="8" fill="#FFF1E6" stroke="#F3C9A4"/>
    <text x="24" y="42" class="cardTitle" fill="#623314">ACP / Editor</text>
    <text x="24" y="78" class="label" fill="#A85C21">IDE-aware context</text>
    <text x="24" y="110" class="muted">Unsaved buffers and editor UI.</text>
  </g>

  <g transform="translate(1058 196)">
    <rect x="0" y="0" width="310" height="150" rx="8" fill="#F1EBFA" stroke="#D7C5EF"/>
    <text x="24" y="42" class="cardTitle" fill="#39205F">Channels / Bots</text>
    <text x="24" y="78" class="label" fill="#7653A8">Team chat surfaces</text>
    <text x="24" y="110" class="muted">QQ, WeCom, Feishu, Telegram, WeChat.</text>
  </g>
  <g transform="translate(1058 388)">
    <rect x="0" y="0" width="310" height="150" rx="8" fill="#E8F4FA" stroke="#BBDCEE"/>
    <text x="24" y="42" class="cardTitle" fill="#15384B">Automations</text>
    <text x="24" y="78" class="label" fill="#2B7599">Scheduled and CI work</text>
    <text x="24" y="110" class="muted">Approvals can be handled elsewhere.</text>
  </g>
  <g transform="translate(1058 580)">
    <rect x="0" y="0" width="310" height="150" rx="8" fill="#F3F4EA" stroke="#D9DEC0"/>
    <text x="24" y="42" class="cardTitle" fill="#3F431E">SDK clients</text>
    <text x="24" y="78" class="label" fill="#727934">Programmatic integrations</text>
    <text x="24" y="110" class="muted">TypeScript, .NET, Python, raw protocol.</text>
  </g>

  <path d="M382 271H490" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M382 463H490" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M382 655H490" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1058 271H950" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1058 463H950" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1058 655H950" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(490 546)">
    <rect x="0" y="0" width="460" height="150" rx="8" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="32" y="48" class="cardTitle" fill="#17203A">Unified Session Core</text>
    <text x="32" y="84" class="mono">Thread / Turn / Item</text>
    <text x="32" y="112" class="muted">Execution, approvals, and streaming events are shared.</text>
  </g>
  <path d="M720 458V546" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
