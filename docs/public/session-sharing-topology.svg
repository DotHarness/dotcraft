<svg xmlns="http://www.w3.org/2000/svg" width="800" height="586" viewBox="0 0 800 586" role="img" aria-label="DotCraft cross-entry session sharing: Desktop, CLI, ACP editors, and SDK clients talk to one AppServer per workspace, which Hub starts before stepping aside. Bots and automations attach to that same server instead of connecting as clients. Every entry maps onto the same Session Core, which writes and replays one durable thread record under .craft/threads/.">
  <title>Cross-entry session sharing</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#2b2e33"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#a9abb0"/></marker>
    <pattern id="hat_sshare" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eef2fe"/>
      <rect width="3" height="8" fill="#2d5cf0" opacity="0.13"/>
    </pattern>
    <pattern id="dots_sshare" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f0f0f2"/>
      <circle cx="3" cy="3" r="1.1" fill="#dfdfe3"/>
    </pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
      .dtitle{font-size:18px;font-weight:700;fill:#1a1c1f;letter-spacing:.2px}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;fill:#82858a}
      .title{font-size:15px;font-weight:600;fill:#1a1c1f}
      .sub{font-size:13px;font-weight:600;fill:#1a1c1f}
      .body{font-size:12px;font-weight:400;fill:#55585c}
      .mono{font-size:12px;font-weight:400;fill:#55585c;font-family:ui-monospace,"SFMono-Regular","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace}
      .node{fill:#ffffff;stroke:#1a1c1f;stroke-width:1.5}
      .accent{fill:url(#hat_sshare);stroke:#1d3fbf;stroke-width:2}
      .zone{fill:url(#dots_sshare)}
      .frame{fill:#ffffff;stroke:#1d3fbf;stroke-width:2}
      .ghost{fill:none;stroke:#d9d9dc;stroke-width:1.5;stroke-dasharray:5 4}
      .link{stroke:#2b2e33;stroke-width:1.5;fill:none;stroke-linejoin:round}
      .link2{stroke:#a9abb0;stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-dasharray:4 4}
      .cap{font-size:12px;font-weight:600;fill:#1a1c1f}
    </style>
  </defs>
  <rect width="800" height="586" fill="#f9f9f9"/>
  <text x="36" y="40" class="dtitle">Cross-entry session sharing</text>
  <svg x="734" y="14" width="30" height="30" viewBox="0 0 1024 1024" fill="none">
    <defs>
      <linearGradient id="lb_sshare" x1="279" y1="766" x2="736" y2="334" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2458f7"/><stop offset=".46" stop-color="#5f82f7"/><stop offset="1" stop-color="#8fa5ff"/>
      </linearGradient>
      <linearGradient id="lm_sshare" x1="380" y1="696" x2="492" y2="557" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2257f5"/><stop offset=".55" stop-color="#577df7"/><stop offset="1" stop-color="#8ca2ff"/>
      </linearGradient>
      <linearGradient id="ly_sshare" x1="481" y1="174" x2="617" y2="713" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffcf11"/><stop offset="1" stop-color="#f6b500"/>
      </linearGradient>
      <filter id="ls_sshare" x="-12%" y="-12%" width="124%" height="124%">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b3d62" flood-opacity=".18"/>
      </filter>
    </defs>
    <g transform="translate(512 528) scale(1.3) translate(-512 -512)">
      <g filter="url(#ls_sshare)">
        <rect x="201" y="365" width="622" height="513" rx="151" fill="#fff"/>
        <rect x="145" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="743" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="438" y="270" width="148" height="182" rx="2" fill="#fff"/>
        <circle cx="512" cy="229" r="116" fill="#fff"/>
      </g>
      <rect x="243" y="408" width="538" height="426" rx="113" fill="url(#lb_sshare)"/>
      <rect x="188" y="514" width="90" height="171" rx="19" fill="url(#lb_sshare)"/>
      <rect x="746" y="514" width="90" height="171" rx="19" fill="url(#lb_sshare)"/>
      <rect x="479" y="337" width="66" height="119" rx="6" fill="url(#lb_sshare)"/>
      <rect x="295" y="464" width="434" height="315" rx="78" fill="#fff"/>
      <circle cx="512" cy="229" r="73" fill="url(#ly_sshare)"/>
      <path d="M387 568 477 634 387 700" stroke="url(#lm_sshare)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M531 696h116" stroke="url(#ly_sshare)" stroke-width="27" stroke-linecap="round"/>
    </g>
  </svg>
  <g transform="translate(0,54)">
  <rect x="36" y="40" width="728" height="116" rx="14" class="zone"/>
  <text x="54" y="66" class="eyebrow">PROTOCOL CLIENTS</text>
  <rect x="52" y="84" width="162" height="52" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <text x="133" y="115" class="title" text-anchor="middle">Desktop</text>
  <rect x="230" y="84" width="162" height="52" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <text x="311" y="115" class="title" text-anchor="middle">CLI</text>
  <rect x="408" y="84" width="162" height="52" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <text x="489" y="115" class="title" text-anchor="middle">Editors (ACP)</text>
  <rect x="586" y="84" width="162" height="52" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <text x="667" y="115" class="title" text-anchor="middle">SDK clients</text>
  <path d="M240 156 V194" class="link" marker-end="url(#a)"/>
  <text x="252" y="178" class="eyebrow">SESSION TRAFFIC</text>
  <rect x="52" y="196" width="448" height="64" rx="10" class="node"/>
  <g transform="translate(70,207) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="6.2" rx="1.6"/><rect x="4.5" y="13.3" width="15" height="6.2" rx="1.6"/><circle cx="7.6" cy="7.6" r="1.1" fill="#1a1c1f" stroke="none"/><circle cx="7.6" cy="16.4" r="1.1" fill="#1a1c1f" stroke="none"/></g>
  <text x="98" y="222" class="title">AppServer</text>
  <text x="70" y="242" class="body">one runtime per workspace</text>
  <rect x="524" y="196" width="224" height="64" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <g transform="translate(542,207) scale(0.8333)" fill="none" stroke="#55585c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M17.2,12.0 L19.6,12.0 M15.7,15.7 L17.4,17.4 M12.0,17.2 L12.0,19.6 M8.3,15.7 L6.6,17.4 M6.8,12.0 L4.4,12.0 M8.3,8.3 L6.6,6.6 M12.0,6.8 L12.0,4.4 M15.7,8.3 L17.4,6.6"/></g>
  <text x="570" y="222" class="title">Hub</text>
  <text x="542" y="242" class="body">starts it, then steps aside</text>
  <path d="M522 228 H502" class="link2" marker-end="url(#b)"/>
  <path d="M240 260 V298" class="link" marker-end="url(#a)"/>
  <text x="252" y="284" class="eyebrow">MAPS</text>
  <rect x="52" y="300" width="448" height="64" rx="10" class="accent"/>
  <g transform="translate(70,311) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4,9 l8,-4 8,4 v8 l-8,4 -8,-4 z M4,9 l8,4 8,-4 M12,13 v8"/></g>
  <text x="98" y="326" class="title">Session Core</text>
  <text x="70" y="346" class="body">every turn runs here</text>
  <rect x="524" y="300" width="224" height="64" rx="10" class="node"/>
  <g transform="translate(542,311) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="7.5" width="15" height="12" rx="3"/><path d="M12,7.5 V4.9"/><circle cx="12" cy="3.9" r="1.1" fill="#1a1c1f" stroke="none"/><path d="M8.6,11.4 l2.3,2.1 -2.3,2.1 M13.4,15.6 h2.6"/></g>
  <text x="570" y="326" class="title">Bots &amp; automations</text>
  <text x="542" y="346" class="body">attached to the server</text>
  <path d="M522 332 H502" class="link" marker-end="url(#a)"/>
  <path d="M240 364 V402" class="link" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="252" y="388" class="eyebrow">WRITE · REPLAY</text>
  <rect x="52" y="404" width="696" height="64" rx="10" class="node"/>
  <g transform="translate(70,415) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6.2" rx="6.8" ry="2.5"/><path d="M5.2,6.2 V17.6 c0,1.4 3,2.6 6.8,2.6 s6.8,-1.2 6.8,-2.6 V6.2"/><path d="M5.2,12 c0,1.4 3,2.6 6.8,2.6 s6.8,-1.2 6.8,-2.6"/></g>
  <text x="98" y="430" class="title">Durable thread record</text>
  <text x="70" y="450" class="mono">.craft/threads/</text>
  <text x="52" y="504" class="cap">Any entry, the same thread.</text>
  </g>
</svg>
