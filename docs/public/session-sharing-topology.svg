<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DotCraft cross-entry session sharing topology</title>
  <desc id="desc">A grouped diagram showing how clients, Hub, AppServer, Session Core, Agent Engine, and workspace state connect for shared sessions.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .title { fill: #17203A; font-size: 42px; font-weight: 760; }
    .subtitle { fill: #667085; font-size: 18px; }
    .cardTitle { font-size: 24px; font-weight: 760; }
    .label { font-size: 14px; font-weight: 720; }
    .body { fill: #1F2937; font-size: 15px; }
    .mono { fill: #1F2937; font-size: 15px; font-family: "Cascadia Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .muted { fill: #667085; font-size: 13px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="dashArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="#F8FAF7"/>
  <text x="72" y="86" class="title">Cross-entry session sharing topology</text>
  <text x="72" y="123" class="subtitle">Hub coordinates local startup; AppServer carries session traffic; .craft/ persists the shared state.</text>

  <g transform="translate(72 178)">
    <rect x="0" y="0" width="298" height="420" rx="8" fill="#E9F5F0" stroke="#B7DED0"/>
    <text x="28" y="44" class="cardTitle" fill="#153E33">Clients</text>
    <line x1="28" y1="64" x2="270" y2="64" stroke="#B7DED0"/>
    <text x="28" y="100" class="mono">Desktop</text>
    <text x="28" y="136" class="mono">ACP / editor</text>
    <text x="28" y="172" class="mono">Channels</text>
    <text x="28" y="208" class="mono">Automations</text>
    <text x="28" y="244" class="mono">SDK clients</text>
    <text x="28" y="342" class="muted">Approvals, deltas, and</text>
    <text x="28" y="364" class="muted">tool state render in</text>
    <text x="28" y="386" class="muted">each client UI.</text>
  </g>

  <g transform="translate(456 178)">
    <rect x="0" y="0" width="240" height="190" rx="8" fill="#F3F4EA" stroke="#D9DEC0"/>
    <text x="28" y="44" class="cardTitle" fill="#3F431E">Hub</text>
    <line x1="28" y1="64" x2="212" y2="64" stroke="#D9DEC0"/>
    <text x="28" y="100" class="label" fill="#727934">Local coordinator</text>
    <text x="28" y="130" class="mono">ensure workspace</text>
    <text x="28" y="156" class="mono">return endpoint</text>
  </g>

  <g transform="translate(456 408)">
    <rect x="0" y="0" width="240" height="190" rx="8" fill="#EAF0FF" stroke="#C2CEF7"/>
    <text x="28" y="44" class="cardTitle" fill="#23305F">AppServer</text>
    <line x1="28" y1="64" x2="212" y2="64" stroke="#C2CEF7"/>
    <text x="28" y="100" class="label" fill="#4459B8">JSON-RPC runtime</text>
    <text x="28" y="130" class="mono">stdio / WebSocket</text>
    <text x="28" y="156" class="mono">thread subscriptions</text>
  </g>

  <g transform="translate(782 178)">
    <rect x="0" y="0" width="258" height="420" rx="8" fill="#FFF1E6" stroke="#F3C9A4"/>
    <text x="28" y="44" class="cardTitle" fill="#623314">Session Core</text>
    <line x1="28" y1="64" x2="230" y2="64" stroke="#F3C9A4"/>
    <text x="28" y="100" class="label" fill="#A85C21">ISessionService</text>
    <text x="28" y="130" class="mono">thread/start</text>
    <text x="28" y="156" class="mono">turn/start</text>
    <text x="28" y="182" class="mono">item events</text>
    <text x="28" y="208" class="mono">approval flow</text>
    <text x="28" y="292" class="label" fill="#A85C21">Agent Engine</text>
    <text x="28" y="322" class="mono">tools</text>
    <text x="28" y="348" class="mono">memory</text>
    <text x="28" y="374" class="mono">skills</text>
  </g>

  <g transform="translate(1126 178)">
    <rect x="0" y="0" width="242" height="420" rx="8" fill="#F1EBFA" stroke="#D7C5EF"/>
    <text x="28" y="44" class="cardTitle" fill="#39205F">.craft state</text>
    <line x1="28" y1="64" x2="214" y2="64" stroke="#D7C5EF"/>
    <text x="28" y="100" class="mono">threads/</text>
    <text x="28" y="130" class="mono">state.db</text>
    <text x="28" y="160" class="mono">tool-results/</text>
    <text x="28" y="190" class="mono">attachments/</text>
    <text x="28" y="220" class="mono">memory/</text>
    <text x="28" y="250" class="mono">dreams/</text>
    <text x="28" y="280" class="mono">skills/ + plugins/</text>
    <text x="28" y="350" class="muted">Restart clients and resume</text>
    <text x="28" y="372" class="muted">from the same state.</text>
  </g>

  <path d="M370 275H456" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M576 368V408" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M370 488H456" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M696 503H782" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1040 388H1126" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1126 458H1040" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M370 330C404 330 414 250 456 250" stroke="#A8B4C6" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#dashArrow)"/>
  <text x="386" y="352" fill="#667085" font-size="13">bootstrap only</text>
  <text x="388" y="528" fill="#667085" font-size="13">session traffic</text>

  <g transform="translate(72 672)">
    <rect x="0" y="0" width="1296" height="88" rx="8" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="28" y="34" fill="#17203A" font-size="17" font-weight="760">Native resume</text>
    <text x="28" y="62" class="body">A Thread started from one surface can be resumed by another. The UI changes, but the AppServer, Session Core, and workspace state stay the same.</text>
  </g>
</svg>
