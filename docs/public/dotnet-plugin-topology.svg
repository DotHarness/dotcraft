<svg xmlns="http://www.w3.org/2000/svg" width="800" height="670" viewBox="0 0 800 670" role="img" aria-label="Two authoring paths produce the same plugin directory. One admission gate checks preflight and trust before any plugin code runs, and the accepted bundle then activates inside the DotCraft process as a generation that publishes kernel contributions and reads a read-only view of host services.">
  <title>.NET plugin authoring and runtime</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#2b2e33"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#a9abb0"/></marker>
    <pattern id="hat_dplugin" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eef2fe"/>
      <rect width="3" height="8" fill="#2d5cf0" opacity="0.13"/>
    </pattern>
    <pattern id="dots_dplugin" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f0f0f2"/>
      <circle cx="3" cy="3" r="1.1" fill="#dfdfe3"/>
    </pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
      .dtitle{font-size:18px;font-weight:700;fill:#1a1c1f;letter-spacing:.2px}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;fill:#82858a}
      .title{font-size:15px;font-weight:600;fill:#1a1c1f}
      .sub{font-size:13px;font-weight:600;fill:#1a1c1f}
      .body{font-size:12px;font-weight:400;fill:#55585c}
      .mono{font-size:12px;font-weight:400;fill:#55585c;font-family:ui-monospace,"SFMono-Regular","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace}
      .node{fill:#ffffff;stroke:#1a1c1f;stroke-width:1.5}
      .accent{fill:url(#hat_dplugin);stroke:#1d3fbf;stroke-width:2}
      .zone{fill:url(#dots_dplugin)}
      .frame{fill:#ffffff;stroke:#1d3fbf;stroke-width:2}
      .ghost{fill:none;stroke:#d9d9dc;stroke-width:1.5;stroke-dasharray:5 4}
      .link{stroke:#2b2e33;stroke-width:1.5;fill:none;stroke-linejoin:round}
      .link2{stroke:#a9abb0;stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-dasharray:4 4}
      .cap{font-size:12px;font-weight:600;fill:#1a1c1f}
    </style>
  </defs>
  <rect width="800" height="670" fill="#f9f9f9"/>
  <text x="36" y="40" class="dtitle">.NET plugin authoring and runtime</text>
  <svg x="734" y="14" width="30" height="30" viewBox="0 0 1024 1024" fill="none">
    <defs>
      <linearGradient id="lb_dplugin" x1="279" y1="766" x2="736" y2="334" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2458f7"/><stop offset=".46" stop-color="#5f82f7"/><stop offset="1" stop-color="#8fa5ff"/>
      </linearGradient>
      <linearGradient id="lm_dplugin" x1="380" y1="696" x2="492" y2="557" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2257f5"/><stop offset=".55" stop-color="#577df7"/><stop offset="1" stop-color="#8ca2ff"/>
      </linearGradient>
      <linearGradient id="ly_dplugin" x1="481" y1="174" x2="617" y2="713" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffcf11"/><stop offset="1" stop-color="#f6b500"/>
      </linearGradient>
      <filter id="ls_dplugin" x="-12%" y="-12%" width="124%" height="124%">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b3d62" flood-opacity=".18"/>
      </filter>
    </defs>
    <g transform="translate(512 528) scale(1.3) translate(-512 -512)">
      <g filter="url(#ls_dplugin)">
        <rect x="201" y="365" width="622" height="513" rx="151" fill="#fff"/>
        <rect x="145" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="743" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="438" y="270" width="148" height="182" rx="2" fill="#fff"/>
        <circle cx="512" cy="229" r="116" fill="#fff"/>
      </g>
      <rect x="243" y="408" width="538" height="426" rx="113" fill="url(#lb_dplugin)"/>
      <rect x="188" y="514" width="90" height="171" rx="19" fill="url(#lb_dplugin)"/>
      <rect x="746" y="514" width="90" height="171" rx="19" fill="url(#lb_dplugin)"/>
      <rect x="479" y="337" width="66" height="119" rx="6" fill="url(#lb_dplugin)"/>
      <rect x="295" y="464" width="434" height="315" rx="78" fill="#fff"/>
      <circle cx="512" cy="229" r="73" fill="url(#ly_dplugin)"/>
      <path d="M387 568 477 634 387 700" stroke="url(#lm_dplugin)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M531 696h116" stroke="url(#ly_dplugin)" stroke-width="27" stroke-linecap="round"/>
    </g>
  </svg>
  <g transform="translate(0,54)">
  <rect x="52" y="40" width="336" height="64" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <g transform="translate(70,51) scale(0.8333)" fill="none" stroke="#55585c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="4.2" width="16.4" height="15.6" rx="2"/><path d="M7.4,9.2 l3,2.8 -3,2.8 M12.4,14.8 h4.2"/></g>
  <text x="98" y="66" class="title">Authoring project</text>
  <text x="70" y="86" class="body">the host compiles it, no SDK needed</text>
  <rect x="412" y="40" width="336" height="64" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <g transform="translate(430,51) scale(0.8333)" fill="none" stroke="#55585c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5,15.5 V18 a2,2 0 0 0 2,2 h11 a2,2 0 0 0 2,-2 v-2.5"/><path d="M12,4.5 V13.5 M8.2,8.3 L12,4.5 15.8,8.3"/></g>
  <text x="458" y="66" class="title">Prebuilt bundle</text>
  <text x="430" y="86" class="body">every dependency shipped inside</text>
  <path d="M220 104 V128 H400" class="link"/>
  <path d="M580 104 V128 H400" class="link"/>
  <path d="M400 128 V154" class="link" marker-end="url(#a)"/>
  <rect x="52" y="156" width="696" height="64" rx="10" class="accent"/>
  <g transform="translate(70,167) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4,9 l8,-4 8,4 v8 l-8,4 -8,-4 z M4,9 l8,4 8,-4 M12,13 v8"/></g>
  <text x="98" y="182" class="title">Plugin directory</text>
  <text x="70" y="202" class="body">a manifest and the assemblies it names</text>
  <rect x="36" y="248" width="728" height="304" rx="14" class="zone"/>
  <text x="54" y="274" class="eyebrow">ONE DOTCRAFT PROCESS</text>
  <rect x="52" y="288" width="320" height="64" rx="10" class="node"/>
  <g transform="translate(70,299) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12,3.4 L18.8,6 V11.4 C18.8,15.7 16,18.6 12,20.4 C8,18.6 5.2,15.7 5.2,11.4 V6 Z"/><path d="M8.9,11.6 l2.3,2.3 4,-4.4"/></g>
  <text x="98" y="314" class="title">Admission</text>
  <text x="70" y="334" class="body">preflight and trust, before any code</text>
  <rect x="428" y="288" width="320" height="64" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <g transform="translate(446,299) scale(0.8333)" fill="none" stroke="#55585c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M17.2,12.0 L19.6,12.0 M15.7,15.7 L17.4,17.4 M12.0,17.2 L12.0,19.6 M8.3,15.7 L6.6,17.4 M6.8,12.0 L4.4,12.0 M8.3,8.3 L6.6,6.6 M12.0,6.8 L12.0,4.4 M15.7,8.3 L17.4,6.6"/></g>
  <text x="474" y="314" class="title">Host services</text>
  <text x="446" y="334" class="body">a filtered, read-only view</text>
  <path d="M240 220 V286" class="link" marker-end="url(#a)"/>
  <path d="M240 352 V390" class="link" marker-end="url(#a)"/>
  <rect x="52" y="392" width="320" height="64" rx="10" class="accent"/>
  <g transform="translate(70,403) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5,10 A7,7 0 0 1 18.5,8 M18.8,3.8 L18.6,8.2 14.2,8"/><path d="M18.5,14 A7,7 0 0 1 5.5,16 M5.2,20.2 L5.4,15.8 9.8,16"/></g>
  <text x="98" y="418" class="title">Activation generation</text>
  <text x="70" y="438" class="body">its own collectible load context</text>
  <rect x="428" y="392" width="320" height="64" rx="10" class="node"/>
  <g transform="translate(446,403) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12,3.8 L20,8 12,12.2 4,8 Z" stroke-linejoin="round"/><path d="M4.5,12.5 L12,16.5 19.5,12.5 M4.5,16.5 L12,20.5 19.5,16.5"/></g>
  <text x="474" y="418" class="title">Kernel contributions</text>
  <text x="446" y="438" class="body">tools · prompts · middleware · lifecycle</text>
  <path d="M588 352 V368 H320 V390" class="link2" marker-end="url(#b)"/>
  <path d="M372 424 H426" class="link" marker-end="url(#a)"/>
  <rect x="260" y="490" width="280" height="34" rx="17" fill="#f5edd6" class="capsule"/>
  <text x="400" y="511" class="body" text-anchor="middle" fill="#7a5d1d">No sandbox · full process authority.</text>
  <text x="52" y="588" class="cap">Admitted first, then part of the kernel.</text>
  </g>
</svg>
