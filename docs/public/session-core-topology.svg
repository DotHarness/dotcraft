<svg xmlns="http://www.w3.org/2000/svg" width="800" height="530" viewBox="0 0 800 530" role="img" aria-label="DotCraft session model: one Session Core owns every thread. A thread is a durable conversation built from turns, and a turn is an ordered run of items — user message, tool call with its approval and result, agent message. The core drives the thread lifecycle, pauses a turn for approval, and streams every change as it happens.">
  <title>DotCraft session model</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#2b2e33"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#a9abb0"/></marker>
    <pattern id="hat_score" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eef2fe"/>
      <rect width="3" height="8" fill="#2d5cf0" opacity="0.13"/>
    </pattern>
    <pattern id="dots_score" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f0f0f2"/>
      <circle cx="3" cy="3" r="1.1" fill="#dfdfe3"/>
    </pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
      .dtitle{font-size:18px;font-weight:700;fill:#1a1c1f;letter-spacing:.2px}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;fill:#82858a}
      .title{font-size:15px;font-weight:600;fill:#1a1c1f}
      .sub{font-size:13px;font-weight:600;fill:#1a1c1f}
      .body{font-size:12px;font-weight:400;fill:#55585c}
      .mono{font-size:12px;font-weight:400;fill:#55585c;font-family:ui-monospace,"SFMono-Regular","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace}
      .node{fill:#ffffff;stroke:#1a1c1f;stroke-width:1.5}
      .accent{fill:url(#hat_score);stroke:#1d3fbf;stroke-width:2}
      .zone{fill:url(#dots_score)}
      .frame{fill:#ffffff;stroke:#1d3fbf;stroke-width:2}
      .ghost{fill:none;stroke:#d9d9dc;stroke-width:1.5;stroke-dasharray:5 4}
      .link{stroke:#2b2e33;stroke-width:1.5;fill:none;stroke-linejoin:round}
      .link2{stroke:#a9abb0;stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-dasharray:4 4}
      .cap{font-size:12px;font-weight:600;fill:#1a1c1f}
    </style>
  </defs>
  <rect width="800" height="530" fill="#f9f9f9"/>
  <text x="36" y="40" class="dtitle">DotCraft session model</text>
  <svg x="734" y="14" width="30" height="30" viewBox="0 0 1024 1024" fill="none">
    <defs>
      <linearGradient id="lb_score" x1="279" y1="766" x2="736" y2="334" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2458f7"/><stop offset=".46" stop-color="#5f82f7"/><stop offset="1" stop-color="#8fa5ff"/>
      </linearGradient>
      <linearGradient id="lm_score" x1="380" y1="696" x2="492" y2="557" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2257f5"/><stop offset=".55" stop-color="#577df7"/><stop offset="1" stop-color="#8ca2ff"/>
      </linearGradient>
      <linearGradient id="ly_score" x1="481" y1="174" x2="617" y2="713" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffcf11"/><stop offset="1" stop-color="#f6b500"/>
      </linearGradient>
      <filter id="ls_score" x="-12%" y="-12%" width="124%" height="124%">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b3d62" flood-opacity=".18"/>
      </filter>
    </defs>
    <g transform="translate(512 528) scale(1.3) translate(-512 -512)">
      <g filter="url(#ls_score)">
        <rect x="201" y="365" width="622" height="513" rx="151" fill="#fff"/>
        <rect x="145" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="743" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="438" y="270" width="148" height="182" rx="2" fill="#fff"/>
        <circle cx="512" cy="229" r="116" fill="#fff"/>
      </g>
      <rect x="243" y="408" width="538" height="426" rx="113" fill="url(#lb_score)"/>
      <rect x="188" y="514" width="90" height="171" rx="19" fill="url(#lb_score)"/>
      <rect x="746" y="514" width="90" height="171" rx="19" fill="url(#lb_score)"/>
      <rect x="479" y="337" width="66" height="119" rx="6" fill="url(#lb_score)"/>
      <rect x="295" y="464" width="434" height="315" rx="78" fill="#fff"/>
      <circle cx="512" cy="229" r="73" fill="url(#ly_score)"/>
      <path d="M387 568 477 634 387 700" stroke="url(#lm_score)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M531 696h116" stroke="url(#ly_score)" stroke-width="27" stroke-linecap="round"/>
    </g>
  </svg>
  <g transform="translate(0,54)">
  <rect x="52" y="40" width="696" height="64" rx="10" class="accent"/>
  <g transform="translate(70,51) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4,9 l8,-4 8,4 v8 l-8,4 -8,-4 z M4,9 l8,4 8,-4 M12,13 v8"/></g>
  <text x="98" y="66" class="title">Session Core</text>
  <text x="70" y="86" class="body">every thread lives here</text>
  <path d="M278 104 V130" class="link" marker-end="url(#a)"/>
  <text x="290" y="124" class="eyebrow">OWNS</text>
  <rect x="52" y="132" width="444" height="278" rx="12" class="frame"/>
  <g transform="translate(68,147) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5,3.5 H14 L18.5,8 V20.5 H6.5 Z M14,3.5 V8 h4.5"/><path d="M9.3,13 h5.4 M9.3,16.5 h5.4"/></g>
  <text x="96" y="162" class="title">Thread</text>
  <text x="68" y="184" class="body">one durable conversation</text>
  <rect x="68" y="204" width="412" height="190" rx="14" class="zone"/>
  <text x="86" y="230" class="eyebrow">ONE TURN · ITEMS IN ORDER</text>
  <rect x="86" y="246" width="376" height="34" rx="8" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <text x="274" y="267" class="body" text-anchor="middle" fill="#2b2e33">User message</text>
  <rect x="86" y="292" width="376" height="34" rx="8" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <text x="274" y="313" class="body" text-anchor="middle" fill="#2b2e33">Tool call · approval · result</text>
  <rect x="86" y="338" width="376" height="34" rx="8" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <text x="274" y="359" class="body" text-anchor="middle" fill="#2b2e33">Agent message</text>
  <path d="M512 104 V370" class="link"/>
  <text x="524" y="124" class="eyebrow">FOR EVERY THREAD</text>
  <path d="M512 164 H526" class="link" marker-end="url(#a)"/>
  <rect x="528" y="132" width="220" height="64" rx="10" class="node"/>
  <g transform="translate(546,143) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5,10 A7,7 0 0 1 18.5,8 M18.8,3.8 L18.6,8.2 14.2,8"/><path d="M18.5,14 A7,7 0 0 1 5.5,16 M5.2,20.2 L5.4,15.8 9.8,16"/></g>
  <text x="574" y="158" class="title">Thread lifecycle</text>
  <text x="546" y="178" class="body">active · paused · archived</text>
  <path d="M512 267 H526" class="link" marker-end="url(#a)"/>
  <rect x="528" y="235" width="220" height="64" rx="10" class="node"/>
  <g transform="translate(546,246) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12,3.4 L18.8,6 V11.4 C18.8,15.7 16,18.6 12,20.4 C8,18.6 5.2,15.7 5.2,11.4 V6 Z"/><path d="M8.9,11.6 l2.3,2.3 4,-4.4"/></g>
  <text x="574" y="261" class="title">Approval pause</text>
  <text x="546" y="281" class="body">a turn waits for a human</text>
  <path d="M512 370 H526" class="link" marker-end="url(#a)"/>
  <rect x="528" y="338" width="220" height="64" rx="10" class="node"/>
  <g transform="translate(546,349) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.8,12.6 H8 L10.2,7.6 13.8,17 15.8,12.6 H20.2"/></g>
  <text x="574" y="364" class="title">Streamed events</text>
  <text x="546" y="384" class="body">every change, as it happens</text>
  <text x="52" y="448" class="cap">One model, one engine.</text>
  </g>
</svg>
