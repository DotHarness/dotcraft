<svg xmlns="http://www.w3.org/2000/svg" width="800" height="604" viewBox="0 0 800 604" role="img" aria-label="Session persistence and resume: the thread rollout on disk is the authoritative record of a conversation, with workspace state and thread artifacts beside it — one repaired from the rollout, one referenced by it. On resume DotCraft validates the thread identity, replays the surviving records, restores the latest usable compaction checkpoint, appends the turns after it, and rebuilds the runtime session.">
  <title>Session persistence and resume</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#2b2e33"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#a9abb0"/></marker>
    <pattern id="hat_spersist" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eef2fe"/>
      <rect width="3" height="8" fill="#2d5cf0" opacity="0.13"/>
    </pattern>
    <pattern id="dots_spersist" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f0f0f2"/>
      <circle cx="3" cy="3" r="1.1" fill="#dfdfe3"/>
    </pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
      .dtitle{font-size:18px;font-weight:700;fill:#1a1c1f;letter-spacing:.2px}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;fill:#82858a}
      .title{font-size:15px;font-weight:600;fill:#1a1c1f}
      .sub{font-size:13px;font-weight:600;fill:#1a1c1f}
      .body{font-size:12px;font-weight:400;fill:#55585c}
      .mono{font-size:12px;font-weight:400;fill:#55585c;font-family:ui-monospace,"SFMono-Regular","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace}
      .node{fill:#ffffff;stroke:#1a1c1f;stroke-width:1.5}
      .accent{fill:url(#hat_spersist);stroke:#1d3fbf;stroke-width:2}
      .zone{fill:url(#dots_spersist)}
      .frame{fill:#ffffff;stroke:#1d3fbf;stroke-width:2}
      .ghost{fill:none;stroke:#d9d9dc;stroke-width:1.5;stroke-dasharray:5 4}
      .link{stroke:#2b2e33;stroke-width:1.5;fill:none;stroke-linejoin:round}
      .link2{stroke:#a9abb0;stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-dasharray:4 4}
      .cap{font-size:12px;font-weight:600;fill:#1a1c1f}
    </style>
  </defs>
  <rect width="800" height="604" fill="#f9f9f9"/>
  <text x="36" y="40" class="dtitle">Session persistence and resume</text>
  <svg x="734" y="14" width="30" height="30" viewBox="0 0 1024 1024" fill="none">
    <defs>
      <linearGradient id="lb_spersist" x1="279" y1="766" x2="736" y2="334" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2458f7"/><stop offset=".46" stop-color="#5f82f7"/><stop offset="1" stop-color="#8fa5ff"/>
      </linearGradient>
      <linearGradient id="lm_spersist" x1="380" y1="696" x2="492" y2="557" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2257f5"/><stop offset=".55" stop-color="#577df7"/><stop offset="1" stop-color="#8ca2ff"/>
      </linearGradient>
      <linearGradient id="ly_spersist" x1="481" y1="174" x2="617" y2="713" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffcf11"/><stop offset="1" stop-color="#f6b500"/>
      </linearGradient>
      <filter id="ls_spersist" x="-12%" y="-12%" width="124%" height="124%">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b3d62" flood-opacity=".18"/>
      </filter>
    </defs>
    <g transform="translate(512 528) scale(1.3) translate(-512 -512)">
      <g filter="url(#ls_spersist)">
        <rect x="201" y="365" width="622" height="513" rx="151" fill="#fff"/>
        <rect x="145" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="743" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="438" y="270" width="148" height="182" rx="2" fill="#fff"/>
        <circle cx="512" cy="229" r="116" fill="#fff"/>
      </g>
      <rect x="243" y="408" width="538" height="426" rx="113" fill="url(#lb_spersist)"/>
      <rect x="188" y="514" width="90" height="171" rx="19" fill="url(#lb_spersist)"/>
      <rect x="746" y="514" width="90" height="171" rx="19" fill="url(#lb_spersist)"/>
      <rect x="479" y="337" width="66" height="119" rx="6" fill="url(#lb_spersist)"/>
      <rect x="295" y="464" width="434" height="315" rx="78" fill="#fff"/>
      <circle cx="512" cy="229" r="73" fill="url(#ly_spersist)"/>
      <path d="M387 568 477 634 387 700" stroke="url(#lm_spersist)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M531 696h116" stroke="url(#ly_spersist)" stroke-width="27" stroke-linecap="round"/>
    </g>
  </svg>
  <g transform="translate(0,54)">
  <rect x="36" y="40" width="728" height="216" rx="14" class="zone"/>
  <text x="54" y="66" class="eyebrow">WORKSPACE DATA ON DISK</text>
  <rect x="52" y="84" width="230" height="140" rx="10" class="accent"/>
  <g transform="translate(70,131) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5,3.5 H14 L18.5,8 V20.5 H6.5 Z M14,3.5 V8 h4.5"/><path d="M9.3,13 h5.4 M9.3,16.5 h5.4"/></g>
  <text x="98" y="146" class="title">Thread rollout</text>
  <text x="70" y="168" class="body">one append-only file per thread</text>
  <rect x="412" y="84" width="336" height="64" rx="10" class="node"/>
  <g transform="translate(430,95) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6.2" rx="6.8" ry="2.5"/><path d="M5.2,6.2 V17.6 c0,1.4 3,2.6 6.8,2.6 s6.8,-1.2 6.8,-2.6 V6.2"/><path d="M5.2,12 c0,1.4 3,2.6 6.8,2.6 s6.8,-1.2 6.8,-2.6"/></g>
  <text x="458" y="110" class="title">Workspace state</text>
  <text x="430" y="130" class="body">business state · query projections</text>
  <rect x="412" y="160" width="336" height="64" rx="10" class="node"/>
  <g transform="translate(430,171) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4,9 l8,-4 8,4 v8 l-8,4 -8,-4 z M4,9 l8,4 8,-4 M12,13 v8"/></g>
  <text x="458" y="186" class="title">Thread artifacts</text>
  <text x="430" y="206" class="body">large results · attachments · terminals</text>
  <path d="M282 116 H410" class="link2" marker-end="url(#b)"/>
  <text x="298" y="108" class="eyebrow">READ-REPAIR</text>
  <path d="M282 192 H410" class="link2" marker-end="url(#b)"/>
  <text x="298" y="184" class="eyebrow">REFERENCES</text>
  <rect x="36" y="284" width="728" height="98" rx="14" class="zone"/>
  <text x="54" y="310" class="eyebrow">ON RESUME</text>
  <rect x="52" y="324" width="128" height="34" rx="8" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <text x="116" y="345" class="body" text-anchor="middle" fill="#2b2e33">Validate identity</text>
  <rect x="197" y="324" width="112" height="34" rx="8" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <text x="253" y="345" class="body" text-anchor="middle" fill="#2b2e33">Replay records</text>
  <rect x="326" y="324" width="140" height="34" rx="8" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <text x="396" y="345" class="body" text-anchor="middle" fill="#2b2e33">Restore checkpoint</text>
  <rect x="483" y="324" width="128" height="34" rx="8" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <text x="547" y="345" class="body" text-anchor="middle" fill="#2b2e33">Append tail turns</text>
  <rect x="628" y="324" width="120" height="34" rx="8" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <text x="688" y="345" class="body" text-anchor="middle" fill="#2b2e33">Rebuild session</text>
  <path d="M182 341 H195" class="link" marker-end="url(#a)"/>
  <path d="M311 341 H324" class="link" marker-end="url(#a)"/>
  <path d="M468 341 H481" class="link" marker-end="url(#a)"/>
  <path d="M613 341 H626" class="link" marker-end="url(#a)"/>
  <path d="M146 224 V322" class="link" marker-end="url(#a)"/>
  <path d="M688 358 V392 H600 V420" class="link" marker-end="url(#a)"/>
  <rect x="52" y="437" width="260" height="34" rx="17" fill="#f5edd6" class="capsule"/>
  <text x="182" y="458" class="body" text-anchor="middle" fill="#7a5d1d">Losing state.db is partial data loss.</text>
  <rect x="348" y="422" width="400" height="64" rx="10" class="accent"/>
  <g transform="translate(366,433) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5,10 A7,7 0 0 1 18.5,8 M18.8,3.8 L18.6,8.2 14.2,8"/><path d="M18.5,14 A7,7 0 0 1 5.5,16 M5.2,20.2 L5.4,15.8 9.8,16"/></g>
  <text x="394" y="448" class="title">Resumed session</text>
  <text x="366" y="468" class="body">client history · model context</text>
  <text x="52" y="522" class="cap">The rollout is the authority.</text>
  </g>
</svg>
