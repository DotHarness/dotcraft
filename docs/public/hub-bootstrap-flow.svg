<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" role="img" aria-label="DotCraft Hub bootstrap flow: a client resolves the workspace path, reads the Hub lock file, verifies that the recorded process is alive and answering, starts Hub only when it is not, then makes one ensure call and opens the returned AppServer WebSocket endpoint directly.">
  <title>Hub bootstrap flow</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#2b2e33"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#a9abb0"/></marker>
    <pattern id="hat_hubboot" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eef2fe"/>
      <rect width="3" height="8" fill="#2d5cf0" opacity="0.13"/>
    </pattern>
    <pattern id="dots_hubboot" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f0f0f2"/>
      <circle cx="3" cy="3" r="1.1" fill="#dfdfe3"/>
    </pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
      .dtitle{font-size:18px;font-weight:700;fill:#1a1c1f;letter-spacing:.2px}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;fill:#82858a}
      .title{font-size:15px;font-weight:600;fill:#1a1c1f}
      .sub{font-size:13px;font-weight:600;fill:#1a1c1f}
      .body{font-size:12px;font-weight:400;fill:#55585c}
      .mono{font-size:12px;font-weight:400;fill:#55585c;font-family:ui-monospace,"SFMono-Regular","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace}
      .node{fill:#ffffff;stroke:#1a1c1f;stroke-width:1.5}
      .accent{fill:url(#hat_hubboot);stroke:#1d3fbf;stroke-width:2}
      .zone{fill:url(#dots_hubboot)}
      .frame{fill:#ffffff;stroke:#1d3fbf;stroke-width:2}
      .ghost{fill:none;stroke:#d9d9dc;stroke-width:1.5;stroke-dasharray:5 4}
      .link{stroke:#2b2e33;stroke-width:1.5;fill:none;stroke-linejoin:round}
      .link2{stroke:#a9abb0;stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-dasharray:4 4}
      .cap{font-size:12px;font-weight:600;fill:#1a1c1f}
    </style>
  </defs>
  <rect width="800" height="570" fill="#f9f9f9"/>
  <text x="36" y="40" class="dtitle">Hub bootstrap flow</text>
  <svg x="734" y="14" width="30" height="30" viewBox="0 0 1024 1024" fill="none">
    <defs>
      <linearGradient id="lb_hubboot" x1="279" y1="766" x2="736" y2="334" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2458f7"/><stop offset=".46" stop-color="#5f82f7"/><stop offset="1" stop-color="#8fa5ff"/>
      </linearGradient>
      <linearGradient id="lm_hubboot" x1="380" y1="696" x2="492" y2="557" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2257f5"/><stop offset=".55" stop-color="#577df7"/><stop offset="1" stop-color="#8ca2ff"/>
      </linearGradient>
      <linearGradient id="ly_hubboot" x1="481" y1="174" x2="617" y2="713" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffcf11"/><stop offset="1" stop-color="#f6b500"/>
      </linearGradient>
      <filter id="ls_hubboot" x="-12%" y="-12%" width="124%" height="124%">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b3d62" flood-opacity=".18"/>
      </filter>
    </defs>
    <g transform="translate(512 528) scale(1.3) translate(-512 -512)">
      <g filter="url(#ls_hubboot)">
        <rect x="201" y="365" width="622" height="513" rx="151" fill="#fff"/>
        <rect x="145" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="743" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="438" y="270" width="148" height="182" rx="2" fill="#fff"/>
        <circle cx="512" cy="229" r="116" fill="#fff"/>
      </g>
      <rect x="243" y="408" width="538" height="426" rx="113" fill="url(#lb_hubboot)"/>
      <rect x="188" y="514" width="90" height="171" rx="19" fill="url(#lb_hubboot)"/>
      <rect x="746" y="514" width="90" height="171" rx="19" fill="url(#lb_hubboot)"/>
      <rect x="479" y="337" width="66" height="119" rx="6" fill="url(#lb_hubboot)"/>
      <rect x="295" y="464" width="434" height="315" rx="78" fill="#fff"/>
      <circle cx="512" cy="229" r="73" fill="url(#ly_hubboot)"/>
      <path d="M387 568 477 634 387 700" stroke="url(#lm_hubboot)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M531 696h116" stroke="url(#ly_hubboot)" stroke-width="27" stroke-linecap="round"/>
    </g>
  </svg>
  <g transform="translate(0,54)">
  <rect x="36" y="40" width="728" height="136" rx="14" class="zone"/>
  <text x="54" y="66" class="eyebrow">FIND A LIVE HUB</text>
  <rect x="52" y="80" width="212" height="72" rx="10" class="node"/>
  <text x="70" y="110" class="title">1 · Resolve</text>
  <text x="70" y="132" class="body">the workspace path</text>
  <rect x="294" y="80" width="212" height="72" rx="10" class="node"/>
  <text x="312" y="110" class="title">2 · Discover</text>
  <text x="312" y="132" class="mono">~/.craft/hub/hub.lock</text>
  <rect x="536" y="80" width="212" height="72" rx="10" class="node"/>
  <text x="554" y="110" class="title">3 · Verify</text>
  <text x="554" y="132" class="body">process alive · status ok</text>
  <path d="M266 116 H292" class="link" marker-end="url(#a)"/>
  <path d="M508 116 H534" class="link" marker-end="url(#a)"/>
  <path d="M672 154 V198" class="link2" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="660" y="182" class="eyebrow" text-anchor="end">IF NOT LIVE</text>
  <rect x="596" y="200" width="152" height="60" rx="10" class="ghost"/>
  <text x="614" y="226" class="title">No live Hub</text>
  <text x="614" y="246" class="body">start Hub, retry</text>
  <path d="M560 154 V298" class="link" marker-end="url(#a)"/>
  <rect x="52" y="300" width="696" height="64" rx="10" class="accent"/>
  <text x="70" y="326" class="title">4 · Ensure the workspace AppServer</text>
  <text x="70" y="346" class="body">Hub starts one or hands back the running one</text>
  <path d="M400 364 V386" class="link" marker-end="url(#a)"/>
  <text x="412" y="380" class="eyebrow">DIRECT FROM HERE</text>
  <rect x="52" y="388" width="696" height="64" rx="10" class="node"/>
  <text x="70" y="414" class="title">5 · Connect to AppServer</text>
  <text x="70" y="434" class="body">open the returned WebSocket endpoint</text>
  <text x="52" y="488" class="cap">Ask Hub once, then talk direct.</text>
  </g>
</svg>
