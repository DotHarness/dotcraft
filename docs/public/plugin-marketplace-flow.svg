<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Plugin marketplace installation flow</title>
  <desc id="desc">A marketplace is added once to DotCraft, while each workspace chooses which plugins to install.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#8090A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .eyebrow { fill: #667085; font-size: 15px; font-weight: 700; letter-spacing: 0.04em; }
    .title { fill: #17203A; font-size: 25px; font-weight: 760; }
    .body { fill: #475467; font-size: 16px; }
    .item { fill: #23305F; font-size: 16px; font-weight: 700; }
    .status { font-size: 14px; font-weight: 700; }
  </style>

  <rect width="1200" height="520" fill="#F8FAF7"/>

  <g transform="translate(70 95)">
    <rect width="380" height="330" rx="16" fill="#EAF0FF" stroke="#C2CEF7" stroke-width="2"/>
    <text x="32" y="46" class="eyebrow">ADD ONCE</text>
    <text x="32" y="82" class="title">Plugin marketplace</text>
    <text x="32" y="112" class="body">A catalog available across your workspaces</text>

    <g transform="translate(32 148)">
      <rect width="316" height="54" rx="10" fill="#FFFFFF" stroke="#D8E0F5"/>
      <rect x="16" y="15" width="24" height="24" rx="6" fill="#4A7FA5"/>
      <text x="56" y="34" class="item">Research tools</text>
    </g>
    <g transform="translate(32 214)">
      <rect width="316" height="54" rx="10" fill="#FFFFFF" stroke="#D8E0F5"/>
      <rect x="16" y="15" width="24" height="24" rx="6" fill="#46A37A"/>
      <text x="56" y="34" class="item">Project workflows</text>
    </g>
  </g>

  <path d="M450 260H550" stroke="#8090A6" stroke-width="2" stroke-linecap="round"/>
  <path d="M550 260C590 260 590 180 642 180" stroke="#8090A6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M550 260C590 260 590 380 642 380" stroke="#8090A6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(650 90)">
    <rect width="480" height="180" rx="16" fill="#E9F5F0" stroke="#B7DED0" stroke-width="2"/>
    <text x="30" y="42" class="eyebrow">WORKSPACE A</text>
    <text x="30" y="78" class="title">Research project</text>
    <g transform="translate(30 108)">
      <rect width="266" height="46" rx="10" fill="#FFFFFF" stroke="#C9E4DA"/>
      <rect x="14" y="12" width="22" height="22" rx="6" fill="#4A7FA5"/>
      <text x="50" y="30" class="item">Research tools</text>
    </g>
    <text x="324" y="137" class="status" fill="#247A57">INSTALLED</text>
  </g>

  <g transform="translate(650 290)">
    <rect width="480" height="180" rx="16" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="2"/>
    <text x="30" y="42" class="eyebrow">WORKSPACE B</text>
    <text x="30" y="78" class="title">Website project</text>
    <g transform="translate(30 108)">
      <rect width="266" height="46" rx="10" fill="#F8FAFC" stroke="#E3E8EF"/>
      <rect x="14" y="12" width="22" height="22" rx="6" fill="#46A37A"/>
      <text x="50" y="30" class="item">Project workflows</text>
    </g>
    <text x="324" y="137" class="status" fill="#667085">AVAILABLE</text>
  </g>
</svg>
