<svg xmlns="http://www.w3.org/2000/svg" width="800" height="478" viewBox="0 0 800 478" role="img" aria-label="A marketplace source becomes one plugin catalog that is added to DotCraft once, and each workspace installs separately from that catalog, so every project keeps only the plugins it needs.">
  <title>Plugin marketplaces</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#2b2e33"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#a9abb0"/></marker>
    <pattern id="hat_market" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eef2fe"/>
      <rect width="3" height="8" fill="#2d5cf0" opacity="0.13"/>
    </pattern>
    <pattern id="dots_market" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f0f0f2"/>
      <circle cx="3" cy="3" r="1.1" fill="#dfdfe3"/>
    </pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
      .dtitle{font-size:18px;font-weight:700;fill:#1a1c1f;letter-spacing:.2px}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;fill:#82858a}
      .title{font-size:15px;font-weight:600;fill:#1a1c1f}
      .sub{font-size:13px;font-weight:600;fill:#1a1c1f}
      .body{font-size:12px;font-weight:400;fill:#55585c}
      .mono{font-size:12px;font-weight:400;fill:#55585c;font-family:ui-monospace,"SFMono-Regular","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace}
      .node{fill:#ffffff;stroke:#1a1c1f;stroke-width:1.5}
      .accent{fill:url(#hat_market);stroke:#1d3fbf;stroke-width:2}
      .zone{fill:url(#dots_market)}
      .frame{fill:#ffffff;stroke:#1d3fbf;stroke-width:2}
      .ghost{fill:none;stroke:#d9d9dc;stroke-width:1.5;stroke-dasharray:5 4}
      .link{stroke:#2b2e33;stroke-width:1.5;fill:none;stroke-linejoin:round}
      .link2{stroke:#a9abb0;stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-dasharray:4 4}
      .cap{font-size:12px;font-weight:600;fill:#1a1c1f}
    </style>
  </defs>
  <rect width="800" height="478" fill="#f9f9f9"/>
  <text x="36" y="40" class="dtitle">Plugin marketplaces</text>
  <svg x="734" y="14" width="30" height="30" viewBox="0 0 1024 1024" fill="none">
    <defs>
      <linearGradient id="lb_market" x1="279" y1="766" x2="736" y2="334" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2458f7"/><stop offset=".46" stop-color="#5f82f7"/><stop offset="1" stop-color="#8fa5ff"/>
      </linearGradient>
      <linearGradient id="lm_market" x1="380" y1="696" x2="492" y2="557" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2257f5"/><stop offset=".55" stop-color="#577df7"/><stop offset="1" stop-color="#8ca2ff"/>
      </linearGradient>
      <linearGradient id="ly_market" x1="481" y1="174" x2="617" y2="713" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffcf11"/><stop offset="1" stop-color="#f6b500"/>
      </linearGradient>
      <filter id="ls_market" x="-12%" y="-12%" width="124%" height="124%">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b3d62" flood-opacity=".18"/>
      </filter>
    </defs>
    <g transform="translate(512 528) scale(1.3) translate(-512 -512)">
      <g filter="url(#ls_market)">
        <rect x="201" y="365" width="622" height="513" rx="151" fill="#fff"/>
        <rect x="145" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="743" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="438" y="270" width="148" height="182" rx="2" fill="#fff"/>
        <circle cx="512" cy="229" r="116" fill="#fff"/>
      </g>
      <rect x="243" y="408" width="538" height="426" rx="113" fill="url(#lb_market)"/>
      <rect x="188" y="514" width="90" height="171" rx="19" fill="url(#lb_market)"/>
      <rect x="746" y="514" width="90" height="171" rx="19" fill="url(#lb_market)"/>
      <rect x="479" y="337" width="66" height="119" rx="6" fill="url(#lb_market)"/>
      <rect x="295" y="464" width="434" height="315" rx="78" fill="#fff"/>
      <circle cx="512" cy="229" r="73" fill="url(#ly_market)"/>
      <path d="M387 568 477 634 387 700" stroke="url(#lm_market)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M531 696h116" stroke="url(#ly_market)" stroke-width="27" stroke-linecap="round"/>
    </g>
  </svg>
  <g transform="translate(0,54)">
  <rect x="52" y="40" width="696" height="64" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <g transform="translate(70,51) scale(0.8333)" fill="none" stroke="#55585c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5,15.5 V18 a2,2 0 0 0 2,2 h11 a2,2 0 0 0 2,-2 v-2.5"/><path d="M12,4.5 V13.5 M8.2,8.3 L12,4.5 15.8,8.3"/></g>
  <text x="98" y="66" class="title">Marketplace source</text>
  <text x="70" y="86" class="body">GitHub repository · Git URL · local folder</text>
  <path d="M212 104 V138" class="link" marker-end="url(#a)"/>
  <rect x="52" y="140" width="320" height="196" rx="12" class="frame"/>
  <g transform="translate(68,155) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12,3.8 L20,8 12,12.2 4,8 Z" stroke-linejoin="round"/><path d="M4.5,12.5 L12,16.5 19.5,12.5 M4.5,16.5 L12,20.5 19.5,16.5"/></g>
  <text x="96" y="170" class="title">Plugin marketplace</text>
  <text x="68" y="192" class="body">added to DotCraft once</text>
  <rect x="68" y="218" width="288" height="44" rx="8" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <text x="212" y="244" class="body" text-anchor="middle" fill="#2b2e33">Research tools</text>
  <rect x="68" y="274" width="288" height="44" rx="8" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <text x="212" y="300" class="body" text-anchor="middle" fill="#2b2e33">Project workflows</text>
  <rect x="452" y="176" width="296" height="64" rx="10" class="node"/>
  <g transform="translate(470,199) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4,9 l8,-4 8,4 v8 l-8,4 -8,-4 z M4,9 l8,4 8,-4 M12,13 v8"/></g>
  <text x="498" y="214" class="title">Research workspace</text>
  <rect x="452" y="296" width="296" height="64" rx="10" class="node"/>
  <g transform="translate(470,319) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4,9 l8,-4 8,4 v8 l-8,4 -8,-4 z M4,9 l8,4 8,-4 M12,13 v8"/></g>
  <text x="498" y="334" class="title">Website workspace</text>
  <path d="M356 240 H404 V208 H450" class="link" marker-end="url(#a)"/>
  <path d="M356 296 H404 V328 H450" class="link" marker-end="url(#a)"/>
  <text x="412" y="272" class="eyebrow">INSTALLED SEPARATELY</text>
  <text x="52" y="396" class="cap">One catalog, many workspaces.</text>
  </g>
</svg>
