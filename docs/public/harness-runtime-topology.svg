<svg xmlns="http://www.w3.org/2000/svg" width="800" height="694" viewBox="0 0 800 694" role="img" aria-label="DotCraft Harness in-process topology: your application owns the .NET process, the host, the workspace, and the user experience. One entry point composes Harness inside that host, which provides the Agentic Loop, tools and approvals, model integrations, and durable sessions, and serves sessions and events back to the application. Session state persists in the workspace folder the application chooses.">
  <title>DotCraft Harness in your .NET process</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#2b2e33"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#a9abb0"/></marker>
    <pattern id="hat_harness" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eef2fe"/>
      <rect width="3" height="8" fill="#2d5cf0" opacity="0.13"/>
    </pattern>
    <pattern id="dots_harness" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f0f0f2"/>
      <circle cx="3" cy="3" r="1.1" fill="#dfdfe3"/>
    </pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
      .dtitle{font-size:18px;font-weight:700;fill:#1a1c1f;letter-spacing:.2px}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;fill:#82858a}
      .title{font-size:15px;font-weight:600;fill:#1a1c1f}
      .sub{font-size:13px;font-weight:600;fill:#1a1c1f}
      .body{font-size:12px;font-weight:400;fill:#55585c}
      .mono{font-size:12px;font-weight:400;fill:#55585c;font-family:ui-monospace,"SFMono-Regular","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace}
      .node{fill:#ffffff;stroke:#1a1c1f;stroke-width:1.5}
      .accent{fill:url(#hat_harness);stroke:#1d3fbf;stroke-width:2}
      .zone{fill:url(#dots_harness)}
      .frame{fill:#ffffff;stroke:#1d3fbf;stroke-width:2}
      .ghost{fill:none;stroke:#d9d9dc;stroke-width:1.5;stroke-dasharray:5 4}
      .link{stroke:#2b2e33;stroke-width:1.5;fill:none;stroke-linejoin:round}
      .link2{stroke:#a9abb0;stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-dasharray:4 4}
      .cap{font-size:12px;font-weight:600;fill:#1a1c1f}
    </style>
  </defs>
  <rect width="800" height="694" fill="#f9f9f9"/>
  <text x="36" y="40" class="dtitle">DotCraft Harness in your .NET process</text>
  <svg x="734" y="14" width="30" height="30" viewBox="0 0 1024 1024" fill="none">
    <defs>
      <linearGradient id="lb_harness" x1="279" y1="766" x2="736" y2="334" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2458f7"/><stop offset=".46" stop-color="#5f82f7"/><stop offset="1" stop-color="#8fa5ff"/>
      </linearGradient>
      <linearGradient id="lm_harness" x1="380" y1="696" x2="492" y2="557" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2257f5"/><stop offset=".55" stop-color="#577df7"/><stop offset="1" stop-color="#8ca2ff"/>
      </linearGradient>
      <linearGradient id="ly_harness" x1="481" y1="174" x2="617" y2="713" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffcf11"/><stop offset="1" stop-color="#f6b500"/>
      </linearGradient>
      <filter id="ls_harness" x="-12%" y="-12%" width="124%" height="124%">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b3d62" flood-opacity=".18"/>
      </filter>
    </defs>
    <g transform="translate(512 528) scale(1.3) translate(-512 -512)">
      <g filter="url(#ls_harness)">
        <rect x="201" y="365" width="622" height="513" rx="151" fill="#fff"/>
        <rect x="145" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="743" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="438" y="270" width="148" height="182" rx="2" fill="#fff"/>
        <circle cx="512" cy="229" r="116" fill="#fff"/>
      </g>
      <rect x="243" y="408" width="538" height="426" rx="113" fill="url(#lb_harness)"/>
      <rect x="188" y="514" width="90" height="171" rx="19" fill="url(#lb_harness)"/>
      <rect x="746" y="514" width="90" height="171" rx="19" fill="url(#lb_harness)"/>
      <rect x="479" y="337" width="66" height="119" rx="6" fill="url(#lb_harness)"/>
      <rect x="295" y="464" width="434" height="315" rx="78" fill="#fff"/>
      <circle cx="512" cy="229" r="73" fill="url(#ly_harness)"/>
      <path d="M387 568 477 634 387 700" stroke="url(#lm_harness)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M531 696h116" stroke="url(#ly_harness)" stroke-width="27" stroke-linecap="round"/>
    </g>
  </svg>
  <g transform="translate(0,54)">
  <rect x="36" y="40" width="728" height="436" rx="14" class="zone"/>
  <text x="54" y="66" class="eyebrow">YOUR .NET PROCESS</text>
  <rect x="52" y="80" width="696" height="64" rx="10" class="node"/>
  <g transform="translate(70,91) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.8" y="4.5" width="16.4" height="11.5" rx="1.8"/><path d="M12,16 V19.3 M8.4,19.5 H15.6"/></g>
  <text x="98" y="106" class="title">Your application</text>
  <text x="70" y="126" class="body">owns the host, the workspace, and the user experience</text>
  <path d="M196 144 V194" class="link" marker-end="url(#a)"/>
  <text x="210" y="176" class="eyebrow">ONE ENTRY POINT</text>
  <path d="M604 196 V146" class="link" marker-end="url(#a)"/>
  <text x="590" y="176" class="eyebrow" text-anchor="end">SESSIONS AND EVENTS</text>
  <rect x="52" y="196" width="696" height="252" rx="12" class="frame"/>
  <g transform="translate(68,211) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M17.2,12.0 L19.6,12.0 M15.7,15.7 L17.4,17.4 M12.0,17.2 L12.0,19.6 M8.3,15.7 L6.6,17.4 M6.8,12.0 L4.4,12.0 M8.3,8.3 L6.6,6.6 M12.0,6.8 L12.0,4.4 M15.7,8.3 L17.4,6.6"/></g>
  <text x="96" y="226" class="title">DotCraft Harness</text>
  <text x="68" y="248" class="body">the agent runtime, running inside your host</text>
  <rect x="68" y="276" width="324" height="64" rx="10" class="accent"/>
  <g transform="translate(86,287) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="7.5" width="15" height="12" rx="3"/><path d="M12,7.5 V4.9"/><circle cx="12" cy="3.9" r="1.1" fill="#1d3fbf" stroke="none"/><path d="M8.6,11.4 l2.3,2.1 -2.3,2.1 M13.4,15.6 h2.6"/></g>
  <text x="114" y="302" class="title">Agentic Loop</text>
  <text x="86" y="322" class="body">plans, calls tools, streams results</text>
  <rect x="408" y="276" width="324" height="64" rx="10" class="node"/>
  <g transform="translate(426,287) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12,3.4 L18.8,6 V11.4 C18.8,15.7 16,18.6 12,20.4 C8,18.6 5.2,15.7 5.2,11.4 V6 Z"/><path d="M8.9,11.6 l2.3,2.3 4,-4.4"/></g>
  <text x="454" y="302" class="title">Tools and approvals</text>
  <text x="426" y="322" class="body">built-in tools plus the ones you add</text>
  <rect x="68" y="360" width="324" height="64" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <g transform="translate(86,371) scale(0.8333)" fill="none" stroke="#55585c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5,7 H19.5 M4.5,12 H19.5 M4.5,17 H19.5"/><circle cx="9.5" cy="7" r="1.9" fill="#ffffff"/><circle cx="15" cy="12" r="1.9" fill="#ffffff"/><circle cx="7.5" cy="17" r="1.9" fill="#ffffff"/></g>
  <text x="114" y="386" class="title">Model integrations</text>
  <text x="86" y="406" class="body">OpenAI and Anthropic, registered for you</text>
  <rect x="408" y="360" width="324" height="64" rx="10" class="node"/>
  <g transform="translate(426,371) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6.2" rx="6.8" ry="2.5"/><path d="M5.2,6.2 V17.6 c0,1.4 3,2.6 6.8,2.6 s6.8,-1.2 6.8,-2.6 V6.2"/><path d="M5.2,12 c0,1.4 3,2.6 6.8,2.6 s6.8,-1.2 6.8,-2.6"/></g>
  <text x="454" y="386" class="title">Durable sessions</text>
  <text x="426" y="406" class="body">threads and turns survive a restart</text>
  <path d="M570 424 V510" class="link" marker-end="url(#a)"/>
  <text x="584" y="494" class="eyebrow">PERSISTS</text>
  <rect x="52" y="512" width="696" height="64" rx="10" fill="#ffffff" stroke="#d9d9dc" stroke-width="1"/>
  <g transform="translate(70,523) scale(0.8333)" fill="none" stroke="#55585c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4,9 l8,-4 8,4 v8 l-8,4 -8,-4 z M4,9 l8,4 8,-4 M12,13 v8"/></g>
  <text x="98" y="538" class="title">Your workspace</text>
  <text x="70" y="558" class="body">sessions and state, kept where you point it</text>
  <text x="52" y="612" class="cap">Embedded, not delegated.</text>
  </g>
</svg>
