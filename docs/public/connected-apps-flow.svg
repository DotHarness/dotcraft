<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534" role="img" aria-label="Connected Apps flow: install the plugin and connect the app once for the whole workspace, then every conversation decides for itself — a new conversation reviews its Apps list and turns the app on before the first message, and can change it at any time afterwards. Disconnecting the app in the workspace affects every conversation.">
  <title>Connected Apps</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#2b2e33"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto-start-reverse"><path d="M0 1L8 4.5L0 8Z" fill="#a9abb0"/></marker>
    <pattern id="hat_capps" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eef2fe"/>
      <rect width="3" height="8" fill="#2d5cf0" opacity="0.13"/>
    </pattern>
    <pattern id="dots_capps" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#f0f0f2"/>
      <circle cx="3" cy="3" r="1.1" fill="#dfdfe3"/>
    </pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
      .dtitle{font-size:18px;font-weight:700;fill:#1a1c1f;letter-spacing:.2px}
      .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;fill:#82858a}
      .title{font-size:15px;font-weight:600;fill:#1a1c1f}
      .sub{font-size:13px;font-weight:600;fill:#1a1c1f}
      .body{font-size:12px;font-weight:400;fill:#55585c}
      .mono{font-size:12px;font-weight:400;fill:#55585c;font-family:ui-monospace,"SFMono-Regular","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace}
      .node{fill:#ffffff;stroke:#1a1c1f;stroke-width:1.5}
      .accent{fill:url(#hat_capps);stroke:#1d3fbf;stroke-width:2}
      .zone{fill:url(#dots_capps)}
      .frame{fill:#ffffff;stroke:#1d3fbf;stroke-width:2}
      .ghost{fill:none;stroke:#d9d9dc;stroke-width:1.5;stroke-dasharray:5 4}
      .link{stroke:#2b2e33;stroke-width:1.5;fill:none;stroke-linejoin:round}
      .link2{stroke:#a9abb0;stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-dasharray:4 4}
      .cap{font-size:12px;font-weight:600;fill:#1a1c1f}
    </style>
  </defs>
  <rect width="800" height="534" fill="#f9f9f9"/>
  <text x="36" y="40" class="dtitle">Connected Apps</text>
  <svg x="734" y="14" width="30" height="30" viewBox="0 0 1024 1024" fill="none">
    <defs>
      <linearGradient id="lb_capps" x1="279" y1="766" x2="736" y2="334" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2458f7"/><stop offset=".46" stop-color="#5f82f7"/><stop offset="1" stop-color="#8fa5ff"/>
      </linearGradient>
      <linearGradient id="lm_capps" x1="380" y1="696" x2="492" y2="557" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2257f5"/><stop offset=".55" stop-color="#577df7"/><stop offset="1" stop-color="#8ca2ff"/>
      </linearGradient>
      <linearGradient id="ly_capps" x1="481" y1="174" x2="617" y2="713" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffcf11"/><stop offset="1" stop-color="#f6b500"/>
      </linearGradient>
      <filter id="ls_capps" x="-12%" y="-12%" width="124%" height="124%">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b3d62" flood-opacity=".18"/>
      </filter>
    </defs>
    <g transform="translate(512 528) scale(1.3) translate(-512 -512)">
      <g filter="url(#ls_capps)">
        <rect x="201" y="365" width="622" height="513" rx="151" fill="#fff"/>
        <rect x="145" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="743" y="472" width="136" height="256" rx="58" fill="#fff"/>
        <rect x="438" y="270" width="148" height="182" rx="2" fill="#fff"/>
        <circle cx="512" cy="229" r="116" fill="#fff"/>
      </g>
      <rect x="243" y="408" width="538" height="426" rx="113" fill="url(#lb_capps)"/>
      <rect x="188" y="514" width="90" height="171" rx="19" fill="url(#lb_capps)"/>
      <rect x="746" y="514" width="90" height="171" rx="19" fill="url(#lb_capps)"/>
      <rect x="479" y="337" width="66" height="119" rx="6" fill="url(#lb_capps)"/>
      <rect x="295" y="464" width="434" height="315" rx="78" fill="#fff"/>
      <circle cx="512" cy="229" r="73" fill="url(#ly_capps)"/>
      <path d="M387 568 477 634 387 700" stroke="url(#lm_capps)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M531 696h116" stroke="url(#ly_capps)" stroke-width="27" stroke-linecap="round"/>
    </g>
  </svg>
  <g transform="translate(0,54)">
  <rect x="36" y="40" width="728" height="136" rx="14" class="zone"/>
  <text x="54" y="66" class="eyebrow">STEP 1 · ONCE PER WORKSPACE</text>
  <rect x="52" y="80" width="200" height="64" rx="10" class="node"/>
  <g transform="translate(70,91) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4,9 l8,-4 8,4 v8 l-8,4 -8,-4 z M4,9 l8,4 8,-4 M12,13 v8"/></g>
  <text x="98" y="106" class="title">Plugin</text>
  <text x="70" y="126" class="body">install and add it</text>
  <rect x="300" y="80" width="200" height="64" rx="10" class="node"/>
  <g transform="translate(318,91) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="3.8"/><path d="M11,13 L19,5 M15,9 l3,3"/></g>
  <text x="346" y="106" class="title">Connect</text>
  <text x="318" y="126" class="body">confirm in the app</text>
  <rect x="548" y="80" width="200" height="64" rx="10" class="accent"/>
  <g transform="translate(566,103) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.3"/><path d="M8.3,12.4 l2.6,2.7 5,-5.4"/></g>
  <text x="594" y="118" class="title">Connected app</text>
  <path d="M252 112 H298" class="link" marker-end="url(#a)"/>
  <path d="M500 112 H546" class="link" marker-end="url(#a)"/>
  <rect x="36" y="228" width="728" height="160" rx="14" class="zone"/>
  <text x="54" y="254" class="eyebrow">STEP 2 · IN EVERY CONVERSATION</text>
  <rect x="52" y="268" width="200" height="64" rx="10" class="node"/>
  <g transform="translate(70,279) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="7.5" width="15" height="12" rx="3"/><path d="M12,7.5 V4.9"/><circle cx="12" cy="3.9" r="1.1" fill="#1a1c1f" stroke="none"/><path d="M8.6,11.4 l2.3,2.1 -2.3,2.1 M13.4,15.6 h2.6"/></g>
  <text x="98" y="294" class="title">New conversation</text>
  <text x="70" y="314" class="body">apps may already be on</text>
  <rect x="300" y="268" width="200" height="64" rx="10" class="accent"/>
  <g transform="translate(318,279) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5,7 H19.5 M4.5,12 H19.5 M4.5,17 H19.5"/><circle cx="9.5" cy="7" r="1.9" fill="#ffffff"/><circle cx="15" cy="12" r="1.9" fill="#ffffff"/><circle cx="7.5" cy="17" r="1.9" fill="#ffffff"/></g>
  <text x="346" y="294" class="title">Apps</text>
  <text x="318" y="314" class="body">turn each app on or off</text>
  <rect x="548" y="268" width="200" height="64" rx="10" class="node"/>
  <g transform="translate(566,279) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5,15.5 V18 a2,2 0 0 0 2,2 h11 a2,2 0 0 0 2,-2 v-2.5"/><path d="M12,4.5 V13.5 M8.2,8.3 L12,4.5 15.8,8.3"/></g>
  <text x="594" y="294" class="title">First message</text>
  <text x="566" y="314" class="body">apps are prepared first</text>
  <path d="M252 300 H298" class="link" marker-end="url(#a)"/>
  <path d="M500 300 H546" class="link" marker-end="url(#a)"/>
  <path d="M648 144 V198 H400 V266" class="link" marker-end="url(#a)"/>
  <path d="M648 332 V356 H400 V334" class="link2" marker-end="url(#b)"/>
  <text x="414" y="350" class="eyebrow">CHANGE ANY TIME</text>
  <rect x="448" y="420" width="300" height="32" rx="16" fill="#f5edd6" class="capsule"/>
  <text x="598" y="440" class="body" text-anchor="middle" fill="#7a5d1d">Disconnecting affects every conversation</text>
  <text x="52" y="440" class="cap">Connect once. Choose every time.</text>
  </g>
</svg>
