<svg width="1440" height="880" viewBox="0 0 1440 880" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DotCraft App Binding handoff</title>
  <desc id="desc">App Binding sequence: enable, handoff, principal authentication, binding activation, MCP capability sync, and confirmation.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .title { fill: #17203A; font-size: 42px; font-weight: 760; }
    .subtitle { fill: #667085; font-size: 18px; }
    .cardTitle { font-size: 24px; font-weight: 760; }
    .label { font-size: 14px; font-weight: 720; }
    .mono { fill: #1F2937; font-size: 15px; font-family: "Cascadia Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .num { fill: #FFFFFF; font-size: 15px; font-weight: 760; }
    .muted { fill: #667085; font-size: 13px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="880" fill="#F8FAF7"/>
  <text x="72" y="86" class="title">DotCraft App Binding handoff</text>
  <text x="72" y="123" class="subtitle">AppServer owns thread authority; each app binding exposes tools through its own Streamable HTTP MCP session.</text>

  <!-- lifelines -->
  <line x1="260" y1="264" x2="260" y2="792" stroke="#C2CCDA" stroke-width="2.5" stroke-dasharray="0.5 9" stroke-linecap="round"/>
  <line x1="720" y1="264" x2="720" y2="792" stroke="#C2CCDA" stroke-width="2.5" stroke-dasharray="0.5 9" stroke-linecap="round"/>
  <line x1="1180" y1="264" x2="1180" y2="792" stroke="#C2CCDA" stroke-width="2.5" stroke-dasharray="0.5 9" stroke-linecap="round"/>

  <!-- actors -->
  <g transform="translate(110 168)">
    <rect x="0" y="0" width="300" height="96" rx="8" fill="#EAF0FF" stroke="#C2CEF7"/>
    <text x="24" y="44" class="cardTitle" fill="#23305F">Desktop</text>
    <text x="24" y="74" class="label" fill="#4459B8">DotCraft client</text>
  </g>
  <g transform="translate(570 168)">
    <rect x="0" y="0" width="300" height="96" rx="8" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="24" y="44" class="cardTitle" fill="#17203A">AppServer</text>
    <text x="24" y="74" class="label" fill="#667085">DotCraft binding layer</text>
  </g>
  <g transform="translate(1030 168)">
    <rect x="0" y="0" width="300" height="96" rx="8" fill="#F1EBFA" stroke="#D7C5EF"/>
    <text x="24" y="44" class="cardTitle" fill="#39205F">Native app</text>
    <text x="24" y="74" class="label" fill="#7653A8">your app + SDK</text>
  </g>

  <!-- step arrows -->
  <path d="M273 320H714" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M707 392H266" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M273 464H1174" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1167 536H726" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1167 608H726" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1167 680H726" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M707 752H266" stroke="#A8B4C6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step labels -->
  <g>
    <rect x="386" y="289" width="214" height="26" rx="7" fill="#FFFFFF" stroke="#E3E8F0"/>
    <text x="493" y="306" text-anchor="middle" class="mono">appBindings/enable</text>
  </g>
  <g>
    <rect x="388" y="361" width="196" height="26" rx="7" fill="#FFFFFF" stroke="#E3E8F0"/>
    <text x="486" y="378" text-anchor="middle" class="mono">handoff: uri + token</text>
  </g>
  <g>
    <rect x="635" y="433" width="176" height="26" rx="7" fill="#FFFFFF" stroke="#E3E8F0"/>
    <text x="723" y="450" text-anchor="middle" class="mono">open OS deep link</text>
  </g>
  <g>
    <rect x="848" y="505" width="196" height="26" rx="7" fill="#FFFFFF" stroke="#E3E8F0"/>
    <text x="946" y="522" text-anchor="middle" class="mono">binding/request/get</text>
  </g>
  <g>
    <rect x="871" y="577" width="150" height="26" rx="7" fill="#FFFFFF" stroke="#E3E8F0"/>
    <text x="946" y="594" text-anchor="middle" class="mono">connection/authenticate</text>
  </g>
  <g>
    <rect x="848" y="649" width="196" height="26" rx="7" fill="#FFFFFF" stroke="#E3E8F0"/>
    <text x="946" y="666" text-anchor="middle" class="mono">binding/activate + MCP</text>
  </g>
  <g>
    <rect x="351" y="721" width="270" height="26" rx="7" fill="#FFFFFF" stroke="#E3E8F0"/>
    <text x="486" y="738" text-anchor="middle" class="mono">appBindings/changed &#8594; active</text>
  </g>

  <!-- side notes -->
  <text x="246" y="324" text-anchor="end" class="muted">user-confirmed</text>
  <text x="1196" y="540" class="muted">inspect from trusted source</text>
  <text x="1196" y="612" class="muted">bind connection to app principal</text>
  <text x="1196" y="684" class="muted">sync and confirm capabilities</text>

  <!-- step numbers -->
  <circle cx="260" cy="320" r="13" fill="#4459B8"/><text x="260" y="325" text-anchor="middle" class="num">1</text>
  <circle cx="720" cy="392" r="13" fill="#475467"/><text x="720" y="397" text-anchor="middle" class="num">2</text>
  <circle cx="260" cy="464" r="13" fill="#4459B8"/><text x="260" y="469" text-anchor="middle" class="num">3</text>
  <circle cx="1180" cy="536" r="13" fill="#7653A8"/><text x="1180" y="541" text-anchor="middle" class="num">4</text>
  <circle cx="1180" cy="608" r="13" fill="#7653A8"/><text x="1180" y="613" text-anchor="middle" class="num">5</text>
  <circle cx="1180" cy="680" r="13" fill="#7653A8"/><text x="1180" y="685" text-anchor="middle" class="num">6</text>
  <circle cx="720" cy="752" r="13" fill="#475467"/><text x="720" y="757" text-anchor="middle" class="num">7</text>

  <!-- authority split -->
  <g transform="translate(72 804)">
    <rect x="0" y="0" width="1296" height="52" rx="8" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="24" y="31" class="label" fill="#17203A">Authority split</text>
    <text x="150" y="31" fill="#475467" font-size="14">DotCraft owns model-visible tool exposure, approval gates, and audit &#183; the app owns authentication, consent, scope grants, and grant proof.</text>
  </g>
</svg>
