<svg width="1440" height="1040" viewBox="0 0 1440 1040" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DotCraft runtime architecture topology</title>
  <desc id="desc">A grouped architecture diagram showing hosts, channels, DotCraft Core, AppServer projection, Hub coordination, clients, and workspace state.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .title { fill: #17203A; font-size: 42px; font-weight: 760; }
    .subtitle { fill: #667085; font-size: 18px; }
    .cardTitle { font-size: 24px; font-weight: 760; }
    .label { font-size: 14px; font-weight: 720; }
    .mono { fill: #1F2937; font-size: 15px; font-family: "Cascadia Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .muted { fill: #667085; font-size: 13px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="1040" fill="#F8FAF7"/>
  <text x="72" y="86" class="title">DotCraft runtime architecture topology</text>
  <text x="72" y="123" class="subtitle">Hosts and channels meet in DotCraft.Core; AppServer projects the same session model to external clients.</text>

  <g transform="translate(72 164)">
    <rect x="0" y="0" width="396" height="258" rx="8" fill="#E9F5F0" stroke="#B7DED0"/>
    <text x="28" y="44" class="cardTitle" fill="#153E33">Process owners</text>
    <line x1="28" y1="64" x2="368" y2="64" stroke="#B7DED0"/>
    <text x="28" y="96" class="label" fill="#2E6B56">Hosts</text>
    <text x="28" y="122" class="mono">DotCraft.App</text>
    <text x="28" y="146" class="mono">CLI host, priority 0</text>
    <text x="28" y="182" class="mono">DotCraft.Gateway</text>
    <text x="28" y="206" class="mono">default host for channels</text>
    <text x="28" y="236" class="muted">Only one host owns the process entry point.</text>
  </g>

  <g transform="translate(72 474)">
    <rect x="0" y="0" width="396" height="258" rx="8" fill="#EAF0FF" stroke="#C2CEF7"/>
    <text x="28" y="44" class="cardTitle" fill="#23305F">Managed channels</text>
    <line x1="28" y1="64" x2="368" y2="64" stroke="#C2CEF7"/>
    <text x="28" y="96" class="label" fill="#4459B8">Loaded by Gateway</text>
    <text x="28" y="122" class="mono">DotCraft.Acp</text>
    <text x="28" y="146" class="mono">DotCraft.Automations</text>
    <text x="28" y="170" class="mono">QQ / WeCom / Feishu</text>
    <text x="28" y="194" class="mono">Telegram / Weixin</text>
    <text x="28" y="236" class="muted">Channel code translates platform input into turns.</text>
  </g>

  <g transform="translate(522 164)">
    <rect x="0" y="0" width="396" height="568" rx="8" fill="#FFF1E6" stroke="#F3C9A4"/>
    <text x="28" y="44" class="cardTitle" fill="#623314">DotCraft.Core</text>
    <line x1="28" y1="64" x2="368" y2="64" stroke="#F3C9A4"/>
    <text x="28" y="96" class="label" fill="#A85C21">Central runtime</text>
    <text x="28" y="124" class="mono">Session Core</text>
    <text x="28" y="148" class="muted">Thread / Turn / Item, ISessionService</text>
    <text x="28" y="190" class="mono">Agents</text>
    <text x="28" y="214" class="muted">Microsoft.Extensions.AI, SubAgents, compaction</text>
    <text x="28" y="256" class="mono">Tools</text>
    <text x="28" y="280" class="muted">File, Shell, Web, LSP, Plan/Todo</text>
    <text x="28" y="322" class="mono">Skills / Plugins / MCP</text>
    <text x="28" y="346" class="muted">Capability discovery and tool injection</text>
    <text x="28" y="388" class="mono">Memory and Dreams</text>
    <text x="28" y="412" class="muted">MEMORY.md, HISTORY.md, background organization</text>
    <text x="28" y="454" class="mono">Hooks / Trace / Config</text>
    <text x="28" y="478" class="muted">Policy, observability, module sections</text>
    <rect x="28" y="514" width="340" height="1" fill="#F5D6BB"/>
    <text x="28" y="540" class="muted">All in-process entries converge here.</text>
  </g>

  <g transform="translate(972 164)">
    <rect x="0" y="0" width="396" height="258" rx="8" fill="#F1EBFA" stroke="#D7C5EF"/>
    <text x="28" y="44" class="cardTitle" fill="#39205F">AppServer projection</text>
    <line x1="28" y1="64" x2="368" y2="64" stroke="#D7C5EF"/>
    <text x="28" y="96" class="label" fill="#7653A8">JSON-RPC over stdio/WebSocket</text>
    <text x="28" y="122" class="mono">initialize / initialized</text>
    <text x="28" y="146" class="mono">thread/* and turn/*</text>
    <text x="28" y="170" class="mono">item/* notifications</text>
    <text x="28" y="194" class="mono">server requests</text>
    <text x="28" y="236" class="muted">External clients see a transport-stable contract.</text>
  </g>

  <g transform="translate(972 474)">
    <rect x="0" y="0" width="396" height="258" rx="8" fill="#E8F4FA" stroke="#BBDCEE"/>
    <text x="28" y="44" class="cardTitle" fill="#15384B">Clients and SDKs</text>
    <line x1="28" y1="64" x2="368" y2="64" stroke="#BBDCEE"/>
    <text x="28" y="96" class="label" fill="#2B7599">Out-of-process users</text>
    <text x="28" y="122" class="mono">Desktop / CLI</text>
    <text x="28" y="146" class="mono">external clients</text>
    <text x="28" y="170" class="mono">SDKs: TypeScript, .NET, Python</text>
    <text x="28" y="194" class="mono">external channel adapters</text>
    <text x="28" y="236" class="muted">They connect, subscribe, and call protocol methods.</text>
  </g>

  <g transform="translate(72 804)">
    <rect x="0" y="0" width="396" height="150" rx="8" fill="#F3F4EA" stroke="#D9DEC0"/>
    <text x="28" y="44" class="cardTitle" fill="#3F431E">Hub</text>
    <line x1="28" y1="64" x2="368" y2="64" stroke="#D9DEC0"/>
    <text x="28" y="96" class="mono">one user-level coordinator</text>
    <text x="28" y="124" class="muted">discovers, starts, and reuses workspace AppServers</text>
  </g>

  <g transform="translate(522 804)">
    <rect x="0" y="0" width="846" height="150" rx="8" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="28" y="44" class="cardTitle" fill="#17203A">Workspace state</text>
    <line x1="28" y1="64" x2="818" y2="64" stroke="#D9E0EA"/>
    <text x="28" y="96" class="mono">.craft/threads</text>
    <text x="222" y="96" class="mono">.craft/state.db</text>
    <text x="418" y="96" class="mono">skills / plugins / automations</text>
    <text x="28" y="124" class="muted">Durable state lets capable clients resume the same work.</text>
  </g>

  <path d="M468 292H514" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M468 604H514" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M918 292H964" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1170 422V466" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M720 732V796" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M270 804V770H620V740" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8" marker-end="url(#arrow)"/>
  <text x="334" y="758" class="muted">starts / reuses runtime</text>
</svg>
