  <g transform="translate(86,435) scale(0.8333)" fill="none" stroke="#1a1c1f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="7.5" width="15" height="12" rx="3"/><path d="M12,7.5 V4.9"/><circle cx="12" cy="3.9" r="1.1" fill="#1a1c1f" stroke="none"/><path d="M8.6,11.4 l2.3,2.1 -2.3,2.1 M13.4,15.6 h2.6"/></g>
