  <g transform="translate(86,347) scale(0.8333)" fill="none" stroke="#1d3fbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4,9 l8,-4 8,4 v8 l-8,4 -8,-4 z M4,9 l8,4 8,-4 M12,13 v8"/></g>
