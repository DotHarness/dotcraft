<svg width="1440" height="1120" viewBox="0 0 1440 1120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DotCraft runtime architecture topology</title>
  <desc id="desc">DotCraft App composes Runtime, AppServer, providers, and optional features. Runtime and optional features depend on Core, Core depends on Agents, and AppServer projects the host-owned Session Core through Protocol contracts to external clients.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .title { fill: #17203A; font-size: 42px; font-weight: 760; }
    .subtitle { fill: #667085; font-size: 18px; }
    .cardTitle { font-size: 24px; font-weight: 760; }
    .label { font-size: 14px; font-weight: 720; }
    .mono { fill: #1F2937; font-size: 15px; font-family: "Cascadia Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .muted { fill: #667085; font-size: 13px; }
    .edgeLabel { fill: #667085; font-size: 12px; font-weight: 650; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="1120" fill="#F8FAF7"/>
  <text x="72" y="82" class="title">DotCraft runtime architecture topology</text>
  <text x="72" y="118" class="subtitle">The official App composes reusable lifecycle, the product kernel, optional features, and the external protocol boundary.</text>

  <g transform="translate(72 158)">
    <rect x="0" y="0" width="1296" height="132" rx="8" fill="#E9F5F0" stroke="#B7DED0"/>
    <text x="28" y="42" class="cardTitle" fill="#153E33">DotCraft.App</text>
    <text x="28" y="72" class="label" fill="#2E6B56">Official composition root</text>
    <text x="28" y="101" class="mono">entry points · host factories · providers · feature adapters · logging · process policy</text>
    <text x="1010" y="101" class="muted">selects the service graph</text>
  </g>

  <g transform="translate(72 360)">
    <rect x="0" y="0" width="370" height="172" rx="8" fill="#EAF0FF" stroke="#C2CEF7"/>
    <text x="28" y="42" class="cardTitle" fill="#23305F">DotCraft.Runtime</text>
    <text x="28" y="72" class="label" fill="#4459B8">Reusable host lifecycle</text>
    <text x="28" y="103" class="mono">AddDotCraftRuntime</text>
    <text x="28" y="128" class="mono">WorkspaceRuntime</text>
    <text x="28" y="151" class="muted">DI, startup, readiness, and shutdown</text>
  </g>

  <g transform="translate(535 360)">
    <rect x="0" y="0" width="370" height="172" rx="8" fill="#F1EBFA" stroke="#D7C5EF"/>
    <text x="28" y="42" class="cardTitle" fill="#39205F">DotCraft.AppServer</text>
    <text x="28" y="72" class="label" fill="#7653A8">Optional protocol projection</text>
    <text x="28" y="103" class="mono">JSON-RPC · stdio · WebSocket</text>
    <text x="28" y="128" class="mono">contract mapping · connections</text>
    <text x="28" y="151" class="muted">reuses the host-owned ISessionService</text>
  </g>

  <g transform="translate(998 360)">
    <rect x="0" y="0" width="370" height="172" rx="8" fill="#E8F4FA" stroke="#BBDCEE"/>
    <text x="28" y="42" class="cardTitle" fill="#15384B">Optional features</text>
    <text x="28" y="72" class="label" fill="#2B7599">Feature-owned behavior</text>
    <text x="28" y="103" class="mono">Automations · Teams</text>
    <text x="28" y="128" class="mono">Dynamic Workflows · channels</text>
    <text x="28" y="151" class="muted">depend on Core, not AppServer</text>
  </g>

  <g transform="translate(300 626)">
    <rect x="0" y="0" width="620" height="226" rx="8" fill="#FFF1E6" stroke="#F3C9A4"/>
    <text x="28" y="42" class="cardTitle" fill="#623314">DotCraft.Core</text>
    <text x="28" y="72" class="label" fill="#A85C21">Product kernel and feature-neutral contracts</text>
    <text x="28" y="105" class="mono">Session Core</text>
    <text x="238" y="105" class="muted">Thread / Turn / Item · ISessionService</text>
    <text x="28" y="138" class="mono">Tools · Context · Memory</text>
    <text x="28" y="171" class="mono">Skills · Plugins · MCP · Security</text>
    <text x="28" y="204" class="mono">Configuration · Modules · Workspace semantics</text>
  </g>

  <g transform="translate(998 626)">
    <rect x="0" y="0" width="370" height="150" rx="8" fill="#F3F4EA" stroke="#D9DEC0"/>
    <text x="28" y="42" class="cardTitle" fill="#3F431E">DotCraft.Protocol</text>
    <text x="28" y="72" class="label" fill="#696D32">Transport contracts</text>
    <text x="28" y="103" class="mono">requests · responses · events</text>
    <text x="28" y="128" class="muted">shared by AppServer and clients</text>
  </g>

  <g transform="translate(422 930)">
    <rect x="0" y="0" width="376" height="126" rx="8" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="28" y="42" class="cardTitle" fill="#17203A">DotCraft.Agents</text>
    <text x="28" y="72" class="label" fill="#667085">Provider-neutral foundation</text>
    <text x="28" y="101" class="mono">facade · contracts · middleware · tool loop</text>
  </g>

  <g transform="translate(72 930)">
    <rect x="0" y="0" width="278" height="126" rx="8" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="24" y="42" class="cardTitle" fill="#17203A">Workspace state</text>
    <text x="24" y="72" class="mono">threads · state.db</text>
    <text x="24" y="101" class="muted">owned by the composed runtime</text>
  </g>

  <g transform="translate(998 852)">
    <rect x="0" y="0" width="370" height="204" rx="8" fill="#FFFFFF" stroke="#D9E0EA"/>
    <text x="28" y="42" class="cardTitle" fill="#17203A">External clients</text>
    <text x="28" y="72" class="label" fill="#667085">Out-of-process access</text>
    <text x="28" y="103" class="mono">Desktop · CLI · ACP</text>
    <text x="28" y="128" class="mono">TypeScript · .NET · Python SDKs</text>
    <text x="28" y="153" class="mono">external channel adapters</text>
    <text x="28" y="182" class="muted">Hub discovers and reuses workspace AppServers</text>
  </g>

  <path d="M257 290V352" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M720 290V352" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1183 290V352" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>

  <path d="M257 532V586H420V618" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M720 532V618" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1183 532V586H900V618" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="690" y="578" class="edgeLabel">uses Core</text>

  <path d="M905 446H965V700H990" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="929" y="668" class="edgeLabel">maps</text>

  <path d="M610 852V922" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="620" y="895" class="edgeLabel">depends on</text>

  <path d="M300 790H214V922" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M1183 844V792H905V520" stroke="#A8B4C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8" marker-end="url(#arrow)"/>
  <text x="1080" y="818" class="edgeLabel">JSON-RPC</text>
</svg>
