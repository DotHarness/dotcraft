services:
  model-service:
    image: ghcr.io/dotharness/dotcraft:${DOTCRAFT_VERSION:-latest}
    command: ["dotcraft", "model-service", "--state", "/state", "serve", "--listen", "http://0.0.0.0:8090"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./state:/state
    ports:
      - "${MODEL_SERVICE_PUBLISH_HOST:-127.0.0.1}:${MODEL_SERVICE_PORT:-8090}:8090"
    restart: unless-stopped

  auth:
    image: ghcr.io/dotharness/dotcraft:${DOTCRAFT_VERSION:-latest}
    profiles: ["auth"]
    command: ["dotcraft", "model-service", "--state", "/state", "auth", "login", "--no-browser"]
    volumes:
      - ./state/credentials:/state/credentials
    network_mode: host
    stdin_open: true
    tty: true
