services:
  dotcraft:
    image: ghcr.io/dotharness/dotcraft:${DOTCRAFT_VERSION:-latest}
    # To build from a source checkout instead of pulling GHCR:
    # build:
    #   context: ../..
    #   dockerfile: docker/dotcraft/Dockerfile
    env_file:
      - .env
    environment:
      DOTCRAFT_WORKSPACE: /workspace
      DOTCRAFT_NODE_BIN: /usr/local/bin/node
      DOTCRAFT_MODULES_DIR: /opt/dotcraft/modules
      APPSERVER_LISTEN_HOST: ${APPSERVER_LISTEN_HOST:-0.0.0.0}
      APPSERVER_PORT: ${APPSERVER_PORT:-9100}
      APPSERVER_TOKEN: ${APPSERVER_TOKEN:?set APPSERVER_TOKEN in .env}
      DASHBOARD_LISTEN_HOST: ${DASHBOARD_LISTEN_HOST:-0.0.0.0}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8080}
      QQ_LISTEN_HOST: ${QQ_LISTEN_HOST:-0.0.0.0}
      QQ_PORT: ${QQ_PORT:-6700}
      WECOM_LISTEN_HOST: ${WECOM_LISTEN_HOST:-0.0.0.0}
      WECOM_PORT: ${WECOM_PORT:-9000}
    ports:
      - "${APPSERVER_PUBLISH_HOST:-127.0.0.1}:${APPSERVER_PORT:-9100}:${APPSERVER_PORT:-9100}"
      - "${DASHBOARD_PUBLISH_HOST:-127.0.0.1}:${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}"
      # Keep channel ports local by default. Set QQ_PUBLISH_HOST or
      # WECOM_PUBLISH_HOST to 0.0.0.0 only when an external gateway must connect.
      - "${QQ_PUBLISH_HOST:-127.0.0.1}:${QQ_PORT:-6700}:${QQ_PORT:-6700}"
      - "${WECOM_PUBLISH_HOST:-127.0.0.1}:${WECOM_PORT:-9000}:${WECOM_PORT:-9000}"
    volumes:
      - ${DOTCRAFT_WORKSPACE_DIR:-./workspace}:/workspace
      - ${DOTCRAFT_STACK_STATE_DIR:-./state}/dotcraft:/root/.craft
    restart: unless-stopped

  auth:
    image: ghcr.io/dotharness/dotcraft:${DOTCRAFT_VERSION:-latest}
    profiles:
      - auth
    network_mode: host
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      all_proxy: ${all_proxy:-}
      no_proxy: ${no_proxy:-}
    volumes:
      - ${DOTCRAFT_STACK_STATE_DIR:-./state}/dotcraft:/root/.craft

  oratorio:
    image: ghcr.io/dotharness/oratorio:${DOTCRAFT_VERSION:-latest}
    # To build from this checkout instead of pulling GHCR:
    # build:
    #   context: ../..
    #   dockerfile: docker/oratorio/Dockerfile
    depends_on:
      - dotcraft
    environment:
      DOTCRAFT_MANAGED_SERVICE_ID: oratorio
      DOTCRAFT_MANAGED_SERVICE_URL: http://0.0.0.0:5087
      DOTCRAFT_MANAGED_SERVICE_TOKEN: ${ORATORIO_SERVICE_TOKEN:?set ORATORIO_SERVICE_TOKEN in .env}
      DOTCRAFT_MANAGED_SERVICE_STATE_ROOT: /data/oratorio
      Oratorio__Settings__Writable: "true"
      Oratorio__DotCraft__AppServerUrl: ws://dotcraft:${APPSERVER_PORT:-9100}/ws
      Oratorio__DotCraft__AppServerToken: ${APPSERVER_TOKEN:?set APPSERVER_TOKEN in .env}
      Oratorio__DotCraft__HubDiscoveryEnabled: "false"
      Oratorio__DotCraft__ManagedWorktreesEnabled: "true"
      Oratorio__DotCraft__WorktreeRoot: /workspace/.craft/oratorio/worktrees
      HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
      HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
      ALL_PROXY: ${ALL_PROXY:-${all_proxy:-}}
      NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
      http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
      https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
      all_proxy: ${all_proxy:-${ALL_PROXY:-}}
      no_proxy: ${no_proxy:-${NO_PROXY:-}}
    ports:
      - "${ORATORIO_PUBLISH_HOST:-127.0.0.1}:${ORATORIO_PORT:-5087}:5087"
    volumes:
      - ${DOTCRAFT_WORKSPACE_DIR:-./workspace}:/workspace
      - ${DOTCRAFT_STACK_STATE_DIR:-./state}/oratorio:/data/oratorio
      - ./secrets:/secrets:ro
    restart: unless-stopped
