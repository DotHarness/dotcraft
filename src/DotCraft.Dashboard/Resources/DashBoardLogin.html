<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/dashboard/assets/dotcraft.svg">
<title>Sign in to DotCraft Dashboard</title>
<script>
try {
  const theme = localStorage.getItem('dotcraft.dashboard.theme');
  document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
    ? theme
    : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
} catch {
  document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}
</script>
<link rel="stylesheet" href="/dashboard/assets/css/tokens.css">
<link rel="stylesheet" href="/dashboard/assets/css/themes.css">
<link rel="stylesheet" href="/dashboard/assets/css/base.css">
<link rel="stylesheet" href="/dashboard/assets/css/controls.css">
<link rel="stylesheet" href="/dashboard/assets/css/overlays.css">
<link rel="stylesheet" href="/dashboard/assets/css/shell.css">
<style>
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: auto;
}

.dash-login__form {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 14px;
  width: min(340px, 100%);
}

.dash-login__form > img { align-self: center; }

.dash-login__title {
  margin-top: 4px;
  text-align: center;
  font-size: var(--type-page-title-size);
  line-height: var(--type-page-title-line-height);
  font-weight: var(--type-page-title-weight);
}

.dash-login__field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  color: var(--text-secondary);
  font-size: var(--type-secondary-size);
}

.dash-login__submit { width: 100%; }
</style>
</head>
<body>
<form class="dash-login__form" id="loginForm" novalidate>
  <img src="/dashboard/assets/dotcraft.svg" width="40" height="40" alt="DotCraft">
  <h1 class="dash-login__title">Sign in to Dashboard</h1>
  <div class="dash-notice dash-notice--error" role="alert" id="loginError" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    <div class="dash-notice__text"><div class="dash-notice__title" id="loginErrorText"></div></div>
  </div>
  <label class="dash-login__field">
    <span>Username</span>
    <input class="dc-field" id="username" name="username" autocomplete="username" autofocus>
  </label>
  <label class="dash-login__field">
    <span>Password</span>
    <input class="dc-field" id="password" name="password" type="password" autocomplete="current-password">
  </label>
  <button type="submit" class="dc-button dash-login__submit" data-variant="primary" data-size="prominent" id="loginButton">
    <span class="dc-button__spinner" aria-hidden="true" hidden><svg class="dc-spinner" width="14" height="14" viewBox="0 0 24 24" fill="none"><circle class="dc-spinner__track" cx="12" cy="12" r="7" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="2" stroke-dasharray="33 44"/></svg></span>
    <span class="dc-button__label">Sign in</span>
  </button>
</form>
<script>
const form = document.getElementById('loginForm');
const username = document.getElementById('username');
const password = document.getElementById('password');
const submit = document.getElementById('loginButton');

function showError(message) {
  document.getElementById('loginErrorText').textContent = message;
  document.getElementById('loginError').hidden = !message;
  username.toggleAttribute('data-invalid', Boolean(message) && !username.value);
  password.toggleAttribute('data-invalid', Boolean(message) && !password.value);
}

function setBusy(busy) {
  submit.disabled = busy;
  submit.toggleAttribute('data-loading', busy);
  submit.querySelector('.dc-button__spinner').hidden = !busy;
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (!username.value || !password.value) {
    showError('Enter both your username and password.');
    return;
  }
  showError('');
  setBusy(true);
  try {
    const res = await fetch('/dashboard/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username.value, password: password.value })
    });
    if (res.ok) {
      window.location.href = '/dashboard/';
      return;
    }
    showError(res.status === 401 ? 'That username and password don’t match.' : 'Sign-in didn’t work. Try again.');
  } catch {
    showError('DotCraft couldn’t be reached. Check that it’s running and try again.');
  }
  setBusy(false);
});
</script>
</body>
</html>
