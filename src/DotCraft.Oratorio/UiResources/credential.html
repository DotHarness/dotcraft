<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  Oratorio credential card for RequestSourceCredential. The secret goes only to the app-only
  SaveSourceCredential tool, so it never reaches the model or the thread history.
-->
<style>
  :root {
    color-scheme: dark;
    --surface: var(--color-background-primary, #202020);
    --field: var(--color-background-secondary, #141515);
    --track: var(--color-background-tertiary, #2a2a2a);
    --ink: var(--color-text-primary, #eeeeec);
    --ink-secondary: var(--color-text-secondary, #a3a3a1);
    --ink-tertiary: var(--color-text-tertiary, #6f706e);
    --ink-inverse: var(--color-text-inverse, #141515);
    --line: var(--color-border-secondary, rgb(238 238 236 / 10%));
    --line-active: var(--color-border-primary, rgb(238 238 236 / 18%));
    --danger: var(--color-text-danger, #f87171);
    --success: var(--color-text-success, #4ade80);
    --radius: var(--border-radius-md, 8px);
    --pill: var(--border-radius-full, 999px);
    --shadow: var(--shadow-sm, 0 1px 3px rgb(0 0 0 / 22%));
  }
  html[data-theme="light"] {
    color-scheme: light;
    --surface: var(--color-background-primary, #f7f7f7);
    --field: var(--color-background-secondary, #ffffff);
    --track: var(--color-background-tertiary, #ededed);
    --ink: var(--color-text-primary, #1a1c1f);
    --ink-secondary: var(--color-text-secondary, #6b6c6f);
    --ink-tertiary: var(--color-text-tertiary, #9a9b9d);
    --ink-inverse: var(--color-text-inverse, #ffffff);
    --line: var(--color-border-secondary, rgb(26 28 31 / 8%));
    --line-active: var(--color-border-primary, rgb(26 28 31 / 14%));
    --danger: var(--color-text-danger, #dc2626);
    --success: var(--color-text-success, #16a34a);
    --shadow: var(--shadow-sm, 0 1px 2px rgb(0 0 0 / 6%));
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif);
    font-size: var(--font-text-md-size, 13px);
    line-height: var(--font-text-md-line-height, 18px);
    color: var(--ink);
    background: var(--surface);
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }

  .card { display: grid; gap: 14px; padding: 14px 16px 16px; }
  .head { display: grid; gap: 2px; }
  .title { font-weight: 600; }
  .summary { font-family: var(--font-mono, ui-monospace, Consolas, monospace); font-size: var(--font-text-sm-size, 12px); line-height: var(--font-text-sm-line-height, 16px); color: var(--ink-secondary); overflow-wrap: anywhere; }

  .fields { display: grid; gap: 12px; }
  .field { display: grid; gap: 6px; }
  .label { font-weight: 500; color: var(--ink-secondary); font-size: var(--font-text-sm-size, 12px); line-height: var(--font-text-sm-line-height, 16px); }

  .input {
    width: 100%;
    height: 32px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--field);
    color: var(--ink);
    font: inherit;
    outline: none;
    transition: border-color 120ms ease;
  }
  .input:focus { border-color: var(--line-active); }
  .input:disabled { opacity: .5; }
  .input::placeholder { color: var(--ink-tertiary); }
  textarea.input { height: auto; min-height: 96px; padding: 8px 10px; line-height: 1.5; resize: vertical; font-family: var(--font-mono, ui-monospace, Consolas, monospace); font-size: var(--font-text-sm-size, 12px); -webkit-text-security: disc; }

  .segmented { display: inline-flex; justify-self: start; gap: 2px; padding: 3px; border-radius: var(--pill); background: var(--track); }
  .segmented button {
    appearance: none;
    border: none;
    border-radius: var(--pill);
    padding: 6px 13px;
    background: transparent;
    color: var(--ink-secondary);
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    transition: background 130ms ease, color 130ms ease;
  }
  .segmented button[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 2%, var(--surface)); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
  .segmented button:disabled { cursor: default; opacity: .6; }

  .hint { margin: 0; color: var(--ink-tertiary); font-size: var(--font-text-sm-size, 12px); line-height: var(--font-text-sm-line-height, 16px); }

  .footer { display: flex; justify-content: flex-end; }
  .btn {
    display: inline-flex;
    align-items: center;
    height: 28px;
    padding: 0 12px;
    border: 1px solid transparent;
    border-radius: var(--pill);
    background: var(--ink);
    color: var(--ink-inverse);
    font: inherit;
    font-size: var(--font-text-sm-size, 12px);
    font-weight: 500;
    cursor: pointer;
    transition: background 120ms ease;
  }
  .btn:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 88%, var(--surface)); }
  .btn:disabled { opacity: .45; cursor: default; }

  .status { display: flex; align-items: flex-start; gap: 7px; color: var(--ink-secondary); font-size: var(--font-text-sm-size, 12px); line-height: var(--font-text-sm-line-height, 16px); }
  .status svg { flex-shrink: 0; width: 14px; height: 14px; margin-top: 1px; }
  .status[data-tone="success"] svg { color: var(--success); }
  .status[data-tone="error"] { color: var(--danger); }
  .status[data-tone="error"] .icon-success, .status[data-tone="success"] .icon-error { display: none; }

  .btn:focus-visible, .segmented button:focus-visible { outline: 2px solid var(--line-active); outline-offset: 2px; }
</style>

    message: (credential, project) => `Guardé el ${credential} para ${project}. Continúa con la configuración de Oratorio.`
  },
  fr: {
    gitlabTitle: 'Jeton d’accès GitLab', githubTitle: 'Clé privée de la GitHub App',
    tokenLabel: 'Jeton d’accès', keyLabel: 'Clé privée', kindLabel: 'Type de jeton',
    projectShort: 'Projet', personalShort: 'Personnel', groupShort: 'Groupe',
    accessToken: 'Jeton d’accès de projet', personalAccessToken: 'Jeton d’accès personnel', groupAccessToken: 'Jeton d’accès de groupe',
    keyPlaceholder: '-----BEGIN RSA PRIVATE KEY-----',
    hint: 'Enregistré par Oratorio. L’agent ne le voit jamais.',
    replaceHint: 'Un identifiant est déjà enregistré. L’enregistrer le remplace.',
    save: 'Enregistrer', replace: 'Remplacer', saving: 'Enregistrement…',
    saved: 'Enregistré. L’agent poursuit la configuration.',
    failed: 'Impossible d’enregistrer l’identifiant.',
    loading: 'Chargement…',
    message: (credential, project) => `J’ai enregistré ${credential} pour ${project}. Poursuis la configuration d’Oratorio.`
  },
  de: {
    gitlabTitle: 'GitLab-Zugriffstoken', githubTitle: 'Privater Schlüssel der GitHub App',
    tokenLabel: 'Zugriffstoken', keyLabel: 'Privater Schlüssel', kindLabel: 'Tokentyp',
    projectShort: 'Projekt', personalShort: 'Persönlich', groupShort: 'Gruppe',
    accessToken: 'Projektzugriffstoken', personalAccessToken: 'Persönliches Zugriffstoken', groupAccessToken: 'Gruppenzugriffstoken',
    keyPlaceholder: '-----BEGIN RSA PRIVATE KEY-----',
    hint: 'Wird von Oratorio gespeichert. Der Agent sieht es nie.',
    replaceHint: 'Es ist bereits ein Zugangsdatum gespeichert. Speichern ersetzt es.',
    save: 'Speichern', replace: 'Ersetzen', saving: 'Wird gespeichert…',
    saved: 'Gespeichert. Der Agent setzt die Einrichtung fort.',
    failed: 'Das Zugangsdatum konnte nicht gespeichert werden.',
    loading: 'Wird geladen…',
    message: (credential, project) => `Ich habe ${credential} für ${project} gespeichert. Bitte setze die Oratorio-Einrichtung fort.`
  }
}

const TOKEN_KINDS = ['accessToken', 'personalAccessToken', 'groupAccessToken']

const el = (id) => document.getElementById(id)
let copy = COPY.en
let request = null
let app = null
let phase = 'loading'
let tokenKind = 'accessToken'
const SHORT = { accessToken: 'projectShort', personalAccessToken: 'personalShort', groupAccessToken: 'groupShort' }

function text(id, value) { el(id).textContent = value }

function applyHostContext(context) {
  if (!context) return
  const variables = context.styles?.variables
  if (variables) {
    for (const [name, value] of Object.entries(variables)) {
      if (value) document.documentElement.style.setProperty(name, value)
    }
  }
  if (typeof context.theme === 'string') document.documentElement.dataset.theme = context.theme
  if (typeof context.locale === 'string') {
    const locale = COPY[context.locale] ? context.locale : context.locale.split('-')[0]
    copy = COPY[locale] ?? COPY.en
    document.documentElement.lang = context.locale
  }
  render()
}

function credentialName() {
  return request?.credential === 'githubAppPrivateKey' ? copy.githubTitle : copy.gitlabTitle
}

function render() {
  const github = request?.credential === 'githubAppPrivateKey'
  const saving = phase === 'saving'
  const saved = phase === 'saved'
  text('title', request ? credentialName() : copy.loading)
  text('summary', request ? [request.project, request.instance].filter(Boolean).join(' · ') : '')
  el('kind-row').hidden = github
  el('token-row').hidden = github
  el('key-row').hidden = !github
  text('kind-label', copy.kindLabel)
  text('token-label', copy.tokenLabel)
  text('key-label', copy.keyLabel)
  el('key').placeholder = copy.keyPlaceholder
  for (const segment of el('kind').querySelectorAll('button')) {
    segment.textContent = copy[SHORT[segment.dataset.value]]
    segment.setAttribute('aria-pressed', String(segment.dataset.value === tokenKind))
    segment.disabled = saving || saved
  }
  text('hint', request?.configured ? copy.replaceHint : copy.hint)
  const value = secret()
  el('form').hidden = !request || saved
  el('token').disabled = saving || saved
  el('key').disabled = saving || saved
  el('save').disabled = saving || saved || !value
  text('save', saving ? copy.saving : request?.configured ? copy.replace : copy.save)
  el('status').hidden = phase !== 'saved' && phase !== 'error'
  el('status').dataset.tone = phase === 'error' ? 'error' : 'success'
  if (saved) text('status-text', copy.saved)
}

function secret() {
  return request?.credential === 'githubAppPrivateKey' ? el('key').value.trim() : el('token').value.trim()
}

function showError(message) {
  phase = 'error'
  render()
  text('status-text', message ? `${copy.failed} ${message}` : copy.failed)
}

function onToolResult(result) {
  if (result?.isError) {
    request = null
    phase = 'error'
    render()
    text('status-text', result.content?.[0]?.text ?? copy.failed)
    el('status').hidden = false
    return
  }
  const data = result?.structuredContent
  if (!data || !data.provider || !data.project) return
  request = data
  if (data.tokenKind && TOKEN_KINDS.includes(data.tokenKind)) tokenKind = data.tokenKind
  phase = 'ready'
  render()
}

async function save() {
  const value = secret()
  if (!app || !request || !value || phase === 'saving' || phase === 'saved') return
  phase = 'saving'
  render()
  const github = request.credential === 'githubAppPrivateKey'
  const args = { provider: request.provider, project: request.project, secret: value }
  if (!github) args.tokenKind = tokenKind
  let result
  try {
    result = await app.callServerTool({ name: 'SaveSourceCredential', arguments: args })
  } catch (error) {
    showError(error?.message)
    return
  }
  if (result?.isError) {
    showError(result.content?.[0]?.text)
    return
  }
  el('token').value = ''
  el('key').value = ''
  phase = 'saved'
  render()
  const credential = github ? copy.githubTitle : copy[tokenKind]
  app.sendMessage({ role: 'user', content: [{ type: 'text', text: copy.message(credential, request.project) }] }).catch(() => {})
}

el('save').addEventListener('click', save)
el('kind').addEventListener('click', (event) => {
  const value = event.target.closest('button')?.dataset.value
  if (!value || value === tokenKind) return
  tokenKind = value
  render()
})
el('token').addEventListener('keydown', (event) => { if (event.key === 'Enter') save() })
el('token').addEventListener('input', () => { if (phase === 'error') phase = 'ready'; render() })
el('key').addEventListener('input', () => { if (phase === 'error') phase = 'ready'; render() })
render()

const client = new window.McpApp({ name: 'oratorio-credential', version: '1' })
client.ontoolresult = onToolResult
client.onhostcontextchanged = applyHostContext
client.connect().then(() => {
  app = client
  applyHostContext(client.getHostContext())
}).catch(() => {})
</script>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="title" id="title"></span>
      <span class="summary" id="summary"></span>
    </div>
    <div class="fields" id="form" hidden>
      <div class="field" id="kind-row">
        <span class="label" id="kind-label"></span>
        <div class="segmented" id="kind" role="group" aria-labelledby="kind-label">
          <button type="button" data-value="accessToken"></button>
          <button type="button" data-value="personalAccessToken"></button>
          <button type="button" data-value="groupAccessToken"></button>
        </div>
      </div>
      <label class="field" id="token-row">
        <span class="label" id="token-label"></span>
        <input class="input" id="token" type="password" autocomplete="off" spellcheck="false" />
      </label>
      <label class="field" id="key-row" hidden>
        <span class="label" id="key-label"></span>
        <textarea class="input" id="key" autocomplete="off" spellcheck="false"></textarea>
      </label>
      <p class="hint" id="hint"></p>
      <div class="footer">
        <button class="btn" id="save" type="button" disabled></button>
      </div>
    </div>
    <div class="status" id="status" role="status" hidden>
      <svg class="icon-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <svg class="icon-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <span id="status-text"></span>
    </div>
  </div>
</body>
</html>
